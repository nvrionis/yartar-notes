obviously agree with one another.\n\nHe does not look stable.\n\n## The deal\n\nHe prepares the party's antidote. They go through the rift, close the far side, and bring back as many [[Memory Shards]] as they can carry.\n\n> [!danger] He is brewing the only cure the party has access to, alone, while they are in another realm.\n\n> [!cael] Cael\n> Cael likes him more than is wise. A man who thinks the past is made of memory rather than stone is a man who has arrived at Cael's own suspicion by a different road.","links":["The Professor's Tower","Evermoors","Lorien","Vanishing Tower","Ilvaeris","Memory Shards"]},{"name":"The Songbird","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"neutral","species":"human","gender":"female","faction":["[[The Ravensworth]]"],"first_seen":"session-1","last_seen":"session-2","aliases":["Iskra Vein"],"name_confirmed":true},"body":"**Real name: [[Iskra Vein]]** *(learned S3)*\n\nFemale, human. The other half of [[The Ravensworth]].\n\nNot yet met face to face. She was present enough to help mark [[Devon Dale]] with the pin and the raven's feather in [[Duskandale]], and left with [[The Knife]] to hunt her.","links":["The Ravensworth","Devon Dale","Duskandale","The Knife"]},{"name":"Tom Farow","kind":"npc","tags":[],"props":{"tier":"recurring","status":"unknown","disposition":"neutral","gender":"male","faction":["[[The Unseen]]"],"first_seen":"session-2","last_seen":"session-2"},"body":"The only survivor of the [[The Unseen|Unseen]] ambush in [[Session 2 - Marked by the Unseen|Session 2]]. Talked, freely, and everything he gave has held up so far.\n\nHe told the party:\n\n- **[[Reon Sahtar]]**, a top man of the Unseen, was waiting at [[The Last Pint]] with a larger force.\n- **[[Elis]]**, a potion mistress in [[The Warrens]], might be able to help with the poison. No promises.\n- **To pass as Unseen:** wear their ring and their bandages, and you will be taken for one of them.\n\nThe party has the rings and the bandages. See [[Unseen Rings & Bandages]].\n\n> [!question] Where did he go, and does the Unseen know he talked?","links":["The Unseen","Session 2 - Marked by the Unseen","Reon Sahtar","The Last Pint","Elis","The Warrens","Unseen Rings & Bandages"]},{"name":"Torvin","kind":"npc","tags":[],"props":{"tier":"recurring","status":"alive","disposition":"ally","species":"half-elf","gender":"male","faction":["[[The Evermoor Caravan]]"],"first_seen":"session-3","last_seen":"session-3"},"body":"Half-elf, of [[Dell]]'s caravan. [[Cael]] saved his daughter.\n\nHe gave Cael an old family heirloom in thanks: [[Torvin's Shield]].\n\n> [!cael] Cael\n> A man handed him something his family had kept for generations, for one afternoon's work. He took it. He has thought about that more than once since.","links":["Dell","Cael","Torvin's Shield","The Evermoor Caravan"]},{"name":"Vetel Kraye","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"friendly","gender":"male","first_seen":"session-2","last_seen":"session-2"},"body":"A strange man, or something near one. He carries a private suffering and a real, personal hatred of [[The Unseen]].\n\nArrived mid-ambush in [[Session 2 - Marked by the Unseen|Session 2]] and turned the fight. Afterwards he sheltered the party in a small cave and fed them breakfast.\n\n**He was [[Devon Dale]]'s extraction** — a griffon, and a way out. She never arrived.\n\nHe is the one who said the only real answer to the poison is a mage to the east, which is the road the party is now on.\n\n## The standing invitation\n\nHe would like to meet again, if fate allows: **the far side of the [[Ironspike Bridge]] in [[Yartar]]**.\n\n> [!question] What is he, and what is his own mission? He said he had one and did not say what.","links":["The Unseen","Session 2 - Marked by the Unseen","Devon Dale","Ironspike Bridge","Yartar"]},{"name":"House Vallen","kind":"faction","tags":[],"props":{"type":"noble","status":"unknown","disposition":"unknown","threat":"unknown","leader":"[[Corvan Vallen]]","base":"[[Duskandale]]","first_seen":"session-1"},"body":"The house of **[[Corvan Vallen]]**, who built [[Duskandale]].\n\nNothing else known. Nobody has asked.","links":["Corvan Vallen","Duskandale"]},{"name":"The Ashrit Circle","kind":"faction","tags":[],"props":{"type":"political","status":"active","disposition":"unknown","threat":"high","first_seen":"session-1","name_confirmed":false},"body":"*(name unconfirmed)*\n\nPresents itself as a resistance movement against [[Caldren Voss]]. It is not one. The movement is a front for gathering money and support toward some other purpose.\n\n[[Devon Dale]] stole from them, took proof of their arrangement with [[The Hand of Yartar]], and they put a bounty on her that [[The Ravensworth]] collected.\n\n> [!danger] They pay for assassins and they are patient. The party has not met a single member of the Circle face to face.","links":["Caldren Voss","Devon Dale","The Hand of Yartar","The Ravensworth"]},{"name":"The Evermoor Caravan","kind":"faction","tags":[],"props":{"type":"other","status":"active","disposition":"ally","threat":"none","members":["[[Dell]]","[[Torvin]]"],"leader":"[[Dell]]","base":"[[Duskandale]]","first_seen":"session-3"},"body":"Not a caravan — **an entire village of the [[Evermoors]]**, uprooted and moving for better ground, hit by [[The Orc Horde]] on the road east.\n\n[[Cael]] saved close to ten of them from certain death. [[Lorien]] gave them the party's horses and 3 pp.\n\n- **[[Dell]]** — their guide and leader. Promised steadfast alliance.\n- **[[Torvin]]** — gave [[Torvin's Shield]] for his daughter's life.\n\nThey were pointed toward [[Duskandale]] and may be there now.\n\n> [!cael] Cael\n> A hundred-odd people who will tell this story for the rest of their lives, with his name in it. He is aware that is a kind of asset and would rather not think about it in those terms.","links":["Evermoors","The Orc Horde","Cael","Lorien","Dell","Torvin","Torvin's Shield","Duskandale"]},{"name":"The Hand of Yartar","kind":"faction","tags":[],"props":{"type":"criminal","status":"active","disposition":"unknown","threat":"high","base":"[[Yartar]]","first_seen":"session-1"},"body":"Criminal organisation gaining serious traction in [[Yartar]]. Their trade is **daggers, poison, and information**.\n\n**Membership is women only.** They hire male goons, who are not members.\n\n## Known\n\n- Working with **[[The Ashrit Circle]]** — [[Devon Dale]] had documents proving it. Those documents left with her allies.\n\n> [!question] What does a poison-and-information guild want with a fake resistance movement? Money and support were being gathered \"for other reasons\" and nobody has said what those reasons are.","links":["Yartar","The Ashrit Circle","Devon Dale"]},{"name":"The Kraken Society","kind":"faction","tags":[],"props":{"type":"criminal","status":"cold","disposition":"hostile","threat":"high","first_seen":"session-0.5"},"body":"Named by [[The KrakenWizard]] as he died beneath [[Noannar's Hold]], along with a promise that the party would regret interfering.\n\nTheir operation drowned a town: a sahuagin caster used the [[Blue Gem]] to raise a pillar of seawater inside the temple, and the water never stopped.\n\nNothing has come of the promise yet. That is not the same as nothing coming of it.","links":["The KrakenWizard","Noannar's Hold","Blue Gem"]},{"name":"The Orc Horde","kind":"faction","tags":[],"props":{"type":"military","status":"active","disposition":"hostile","threat":"high","leader":"[[The Orc Warleader]]","base":"[[The Professor's Tower]]","first_seen":"session-3"},"body":"Fifty to sixty strong, **not all of them fighting forces** — which means camp, families, or followers. Led by [[The Orc Warleader]], a towering female orc.\n\nThey attacked [[The Evermoor Caravan]] on the road, and are now camped in the [[Netheril|Netherese ruins]] surrounding [[The Professor's Tower]].\n\nThe party slipped past them invisible. They are still there.\n\n> [!question] Why is a horde with non-combatants besieging one wizard's tower in a Netherese ruin? Sieges are not what raiders do.","links":["The Orc Warleader","The Evermoor Caravan","Netheril","The Professor's Tower"]},{"name":"The Ravensworth","kind":"faction","tags":[],"props":{"type":"criminal","status":"active","disposition":"neutral","threat":"high","members":["[[The Knife]]","[[The Songbird]]"],"first_seen":"session-1","name_confirmed":false},"body":"Two human siblings, legends in assassin circles, described as above the party's power. Reputation: **they never miss.**\n\n- **[[The Knife]]** — [[Doman Vein]] — male\n- **[[The Songbird]]** — [[Iskra Vein]] — female\n\nThey took the [[The Ashrit Circle|Circle]]'s bounty on [[Devon Dale]], marked her in [[Duskandale]] with a pin and a raven's feather, and are hunting her now.\n\n## Dealings\n\nThey have dealt straight with the party once: antidotes for a direction, delivered as promised. They are not currently enemies.\n\n> [!question] If their names are Vein, what is *Ravensworth*? A title, a company, a house they work for, or a name they were given.","links":["The Knife","The Songbird","The Ashrit Circle","Devon Dale","Duskandale"]},{"name":"The Unseen","kind":"faction","tags":[],"props":{"type":"criminal","status":"active","disposition":"hostile","threat":"high","members":["[[Selda]]","[[Tom Farow]]"],"leader":"[[Reon Sahtar]]","base":"[[The Warrens]]","first_seen":"session-2"},"body":"A faction rooted mainly in [[The Warrens]] of [[Yartar]]. In the city they are talked about the way people talk about the boogeyman — closer to folklore than to a gang.\n\nThey ambushed the party in [[Session 2 - Marked by the Unseen|Session 2]] and lost, largely because [[Vetel Kraye]] hates them and arrived.\n\n## Known\n\n- Their caster was **[[Selda]]**, a high elf wizard, killed.\n- **[[Reon Sahtar]]** is a top man, and was waiting at [[The Last Pint]] with a bigger force.\n- **You can pass as one of them** with their ring and their bandages. The party has both — see [[Unseen Rings & Bandages]].\n- [[Vetel Kraye]] has a personal grievance against them and has not explained it.\n\n> [!question] A folklore gang in the slums fielding a high elf wizard with a signet ring. Somebody is paying for this.","links":["The Warrens","Yartar","Session 2 - Marked by the Unseen","Vetel Kraye","Selda","Reon Sahtar","The Last Pint","Unseen Rings & Bandages","Tom Farow"]},{"name":"7 Sinners","kind":"location","tags":[],"props":{"type":"venue","status":"intact","danger":"safe","access":"open","parent":"[[Waterfront]]","first_seen":"session-1","last_visited":"session-1"},"body":"A street gambling den on the [[Waterfront]] with a back room for meetings.\n\nWhere [[Rennik Dale]] put the job to the party, and where they first met [[Lorien]].","links":["Waterfront","Rennik Dale","Lorien"]},{"name":"Duskandale","kind":"location","tags":[],"props":{"type":"village","status":"intact","danger":"watched","access":"open","controlled_by":"[[House Vallen]]","first_seen":"session-1","last_visited":"session-3"},"body":"A gem of a village, built by **[[Corvan Vallen]]** of [[House Vallen]].\n\nRich, peaceful, uniformly happy — the party's own words were *idyllic, like a picture*. A dwarf family welcomed them in. [[Brek]] keeps watch by lounging in an old windmill. Everyone gathers at [[The Hearthstone]] in the square in the evening.\n\nIt is also where [[Devon Dale]] was marked, where [[Tak]] was hung outside a window, and where [[Cael]] walked out wearing her face. **The village knew none of it.**\n\n[[Dell]]'s refugees were sent here.\n\n> [!question] Its name exists in Common **and Elvish**, which was noted as strange and never followed up. Nothing else in the village explains why.","links":["Corvan Vallen","House Vallen","Brek","The Hearthstone","Devon Dale","Tak","Cael","Dell"]},{"name":"Evermoors","kind":"location","tags":[],"props":{"type":"region","status":"intact","danger":"risky","access":"open","first_seen":"session-3","last_visited":"session-3"},"body":"Moorland to the north. The party's road east runs just below its southern edge.\n\nAn entire village of the Evermoors was uprooted and moving out for better ground when [[The Orc Horde]] hit them. See [[The Evermoor Caravan]].","links":["The Orc Horde","The Evermoor Caravan"]},{"name":"High Ward","kind":"location","tags":[],"props":{"type":"district","status":"intact","danger":"safe","access":"restricted","parent":"[[Yartar]]","controlled_by":"[[Caldren Voss]]","first_seen":"session-1"},"body":"District of [[Yartar]]: the Waterbaron, his clerks, the law, the registries.","links":["Yartar","Caldren Voss"]},{"name":"Ironspike Bridge","kind":"location","tags":[],"props":{"type":"landmark","status":"intact","danger":"safe","access":"open","parent":"[[Yartar]]","first_seen":"session-2"},"body":"A bridge in [[Yartar]]. **[[Vetel Kraye]] asked to be met on the far side of it**, if fate allows.\n\nSee [[Promises & Debts]].","links":["Yartar","Vetel Kraye","Promises & Debts"]},{"name":"Merchant Quarter","kind":"location","tags":[],"props":{"type":"district","status":"intact","danger":"safe","access":"restricted","parent":"[[Yartar]]","first_seen":"session-1"},"body":"Rich district of [[Yartar]]. The party has no real access.","links":["Yartar"]},{"name":"Noannar's Hold","kind":"location","tags":[],"props":{"type":"ruin","status":"destroyed","danger":"deadly","access":"barred","first_seen":"session-0.5","last_visited":"session-0.5"},"body":"Drowned. See [[Session 0.5 - Noannar's Hold Massacre|Session 0.5]].\n\nA caravan stop with a temple of **Eldath** standing on a much older site — one that had belonged to **Leira** in ages past. [[Sol]] the sailor knew, and told [[Cael]].\n\nThe temple was the trap. A gathering was called, the doors were barricaded, a pillar of seawater rose inside from nothing, and sahuagin came out of it. The water did not stop. The Hold went under.\n\nBeneath it: a cave system, the [[Blue Gem]], and [[The KrakenWizard]].\n\n> [!cael] Cael\n> A town praying to one goddess in a house built for another, and none of them any worse off for it. He has not stopped turning that over.","links":["Session 0.5 - Noannar's Hold Massacre","Sol","Cael","Blue Gem","The KrakenWizard"]},{"name":"Temple District","kind":"location","tags":[],"props":{"type":"district","status":"intact","danger":"safe","access":"restricted","parent":"[[Yartar]]","first_seen":"session-1"},"body":"District of [[Yartar]]. **Tymora only** — no other faith holds ground here.\n\nConvenient for a wandering priest of Luck. See [[Cael]].","links":["Yartar","Cael"]},{"name":"The Broke Wheel","kind":"location","tags":[],"props":{"type":"venue","status":"intact","danger":"safe","access":"open","parent":"[[Yartar]]","first_seen":"pre-campaign"},"body":"A plain caravan inn out by [[Yartar]]'s north fields, near the Hiring-Fair grounds. Kept by [[Perra Volk]], who holds a room for [[Cael]] between runs.","links":["Yartar","Perra Volk","Cael"]},{"name":"The Drawbridge","kind":"location","tags":[],"props":{"type":"landmark","status":"intact","danger":"safe","access":"open","first_seen":"session-3","last_visited":"session-3"},"body":"An old drawbridge south of the [[Evermoors]] — a magnificent piece of engineering from an earlier age, long out of use.\n\n[[Lorien]]'s magic brought it back into working order and the party crossed.\n\n> [!cael] Cael\n> While he was handling the ropes, inside that magic, time slipped for him. Briefly and wrongly. See [[Open Threads]].","links":["Evermoors","Lorien","Open Threads"]},{"name":"The Hearthstone","kind":"location","tags":[],"props":{"type":"venue","status":"intact","danger":"watched","access":"open","parent":"[[Duskandale]]","first_seen":"session-1","last_visited":"session-1"},"body":"The tavern on the square in [[Duskandale]], where the whole village gathers of an evening.\n\nWhere [[Devon Dale]] refused to run, produced the documents, and gave the performance of her life. And where [[Tak]]'s body hung outside the window while she did it.","links":["Duskandale","Devon Dale","Tak"]},{"name":"The Last Pint","kind":"location","tags":[],"props":{"type":"venue","status":"intact","danger":"risky","access":"open","first_seen":"session-2","last_visited":"session-2"},"body":"Where the party stayed the night before [[Session 2 - Marked by the Unseen|Session 2]], played a well-received set as [[The Harpies Lyras]], and picked up a business proposal.\n\n**It is also where they were poisoned**, the following morning.\n\n[[Tom Farow]] reported that [[Reon Sahtar]] was waiting there with a larger force.\n\n> [!danger] Do not go back without a plan.","links":["Session 2 - Marked by the Unseen","The Harpies Lyras","Tom Farow","Reon Sahtar"]},{"name":"The Professor's Tower","kind":"location","tags":[],"props":{"type":"landmark","status":"intact","danger":"risky","access":"barred","controlled_by":"[[The Professor]]","first_seen":"session-3","last_visited":"session-3"},"body":"East of the [[Evermoors]]. Home of **[[The Professor]]** and his construct **[[Beat]]**.\n\n**Surrounded** by [[The Orc Horde]], fifty to sixty strong, camped in [[Netheril|Netherese ruins]]. The party got in invisible on a promise of safe passage if they could reach the door.\n\nContains: a locked laboratory (raided for antitoxins, against orders), and **a rift** into the [[Vanishing Tower]].","links":["Evermoors","The Professor","Beat","The Orc Horde","Netheril","Vanishing Tower"]},{"name":"The Warrens","kind":"location","tags":[],"props":{"type":"district","status":"intact","danger":"risky","access":"open","parent":"[[Yartar]]","controlled_by":"[[The Unseen]]","first_seen":"session-1"},"body":"Slums of [[Yartar]]. Easy to disappear into if you know your way around.\n\nHome ground of [[The Unseen]]. [[Elis]] the potion mistress is said to be findable here.","links":["Yartar","The Unseen","Elis"]},{"name":"Vanishing Tower","kind":"location","tags":[],"props":{"type":"planar","status":"intact","danger":"deadly","access":"restricted","controlled_by":"[[Ilvaeris]]","first_seen":"session-3","last_visited":"session-3"},"body":"The tower of **[[Ilvaeris]]**, god of time, memories and history. The party is inside it now.\n\nA realm of its own: columns made of memory, and things living in it that feed on memory. Alien throughout, and dangerous throughout.\n\n**The task:** close the rift on this side, and carry back as many [[Memory Shards]] as possible.\n\n[[The Professor]] has been sending expeditions here as an experiment to prove that time is a collection of memories.","links":["Ilvaeris","Memory Shards","The Professor"]},{"name":"Waterfront","kind":"location","tags":[],"props":{"type":"district","status":"intact","danger":"risky","access":"open","parent":"[[Yartar]]","first_seen":"session-1"},"body":"District of [[Yartar]]. Dangerous, busy, and the party's ground. [[Rennik Dale]] runs the fixing here. [[7 Sinners]] is here.","links":["Yartar","Rennik Dale","7 Sinners"]},{"name":"Yartar","kind":"location","tags":[],"props":{"type":"city","status":"intact","danger":"watched","access":"open","controlled_by":"[[Caldren Voss]]","first_seen":"session-1","last_visited":"session-1"},"body":"Home base, in the loose sense that the party keeps returning to it.\n\n## Who holds it\n\n**[[Caldren Voss]]**, Waterbaron by coup. He executed his predecessor and burned her; her handprint is still visible on the side of the bridge. He calls himself a baron of the people, for the people. Many disagree, loudly and quietly.\n\n## Districts\n\n| District | Notes |\n|---|---|\n| [[Merchant Quarter]] | Rich. No real access. |\n| [[Waterfront]] | Dangerous, and where the party operates. [[Rennik Dale]]'s ground. |\n| [[The Warrens]] | Slums. Easy to disappear in, if you know your way. [[The Unseen]] live here. |\n| [[High Ward]] | The Waterbaron, the clerks, the law. |\n| [[Temple District]] | **Tymora only.** |\n\n## Powers\n\n[[The Hand of Yartar]] · [[The Unseen]] · [[The Ashrit Circle]] (operating on the city, from outside it)\n\n## Places\n\n[[7 Sinners]] · [[The Broke Wheel]] · [[Ironspike Bridge]]\n\n> [!question] A temple district that permits exactly one goddess is a policy, not an accident. Whose?","links":["Caldren Voss","Merchant Quarter","Waterfront","Rennik Dale","The Warrens","The Unseen","High Ward","Temple District","The Hand of Yartar","The Ashrit Circle","7 Sinners","The Broke Wheel","Ironspike Bridge"]},{"name":"Eldath and the Older Temple","kind":"lore","tags":[],"props":{"type":"history","confidence":"established","source":"[[Sol]]","first_seen":"session-0.5"},"body":"The temple at [[Noannar's Hold]] was a house of **Eldath**, goddess of peace — built on a site that had belonged to **Leira**, the Lady of Mists, in ages past.\n\n[[Sol]] the sailor knew the site was older. [[Cael]] confirmed it.\n\nThe people of the Hold prayed there in good faith and had no idea. Whether it mattered to their prayers, nobody can say — and then the temple became a slaughterhouse and the whole town drowned, which does not settle the question either way.\n\n> [!cael] Cael\n> He smiled about it, and said nothing.","links":["Noannar's Hold","Sol","Cael"]},{"name":"Ilvaeris","kind":"lore","tags":[],"props":{"type":"deity","confidence":"reported","source":"[[The Professor]]","first_seen":"session-3"},"body":"God of **time, memories and history**. The [[Vanishing Tower]] is his.\n\nEverything the party knows about him comes through [[The Professor]], who is not a neutral source and is not stable.","links":["Vanishing Tower","The Professor"]},{"name":"Netheril","kind":"lore","tags":[],"props":{"type":"history","confidence":"established","first_seen":"session-3"},"body":"The ancient ruins in which [[The Orc Horde]] is camped, outside [[The Professor's Tower]], are **Netherese** — identified after the fact.\n\nA wizard studying rifts in time has built his tower in a Netherese ruin. That is unlikely to be a coincidence.","links":["The Orc Horde","The Professor's Tower"]},{"name":"Perception and Reality","kind":"lore","tags":[],"props":{"type":"theme","confidence":"theory","first_seen":"session-0.5"},"body":"A running thread, gathered here because it keeps coming back.\n\n- A town praying to the wrong goddess and none the worse for it — [[Eldath and the Older Temple]].\n- [[Vaelis]] taking the last breath of the dying and borrowing how they saw the world at the end.\n- [[Cael]] talking [[Devon Dale]] into surviving by telling her to **shift her perception** — the city, not the group.\n- [[The Professor]] holding that time itself is [[Time as Memory|made of memory]].\n- [[Cael]]'s own trade: a blessing is a way of getting a man to believe the moment is his, and belief moves the outcome.\n\n> [!cael] Cael\n> He notices that the campaign keeps handing him the same idea from different mouths. He does not think that is a coincidence, and he has not said so.","links":["Eldath and the Older Temple","Vaelis","Cael","Devon Dale","The Professor","Time as Memory"]},{"name":"Sahuagin and the Pillar","kind":"lore","tags":[],"props":{"type":"history","confidence":"established","first_seen":"session-0.5"},"body":"At [[Noannar's Hold]], a sahuagin caster used the **[[Blue Gem]]** to raise a pillar of seawater inside a sealed temple, out of nothing. Sahuagin came out of the pillar. The water did not stop rising afterwards, and the town went under.\n\n[[The Kraken Society]] was behind it, by [[The KrakenWizard]]'s own dying word.\n\n> [!question] The gem made an ocean where there was none. That is not a raid — that is terraforming. Who wanted the Hold underwater, and are there other gems?","links":["Noannar's Hold","Blue Gem","The Kraken Society","The KrakenWizard"]},{"name":"Time as Memory","kind":"lore","tags":[],"props":{"type":"theory","confidence":"theory","source":"[[The Professor]]","first_seen":"session-3"},"body":"*[[The Professor]]'s thesis*\n\nThat time is not a substance but **a collection of memories** — and that the [[Vanishing Tower]] of [[Ilvaeris]] is the proof, if someone will go in and fetch it.\n\nExpeditions through the rift are the experiment. [[Memory Shards]] are the data.\n\nIt is the fourth time the campaign has put the same idea in front of the party. See [[Perception and Reality]].\n\n> [!cael] Cael\n> If the past is made of memory rather than stone, then it is made of what people hold — and what people hold can be given to them. Cael has believed something adjacent to this his whole life without ever hearing it stated as a theory. He is not going to say so out loud.\n\n> [!question] He is simultaneously trying to **close** the rifts and to keep **using** them. Which of those is the real project?","links":["The Professor","Vanishing Tower","Ilvaeris","Memory Shards","Perception and Reality"]},{"name":"Blue Gem","kind":"item","tags":[],"props":{"type":"artifact","status":"lost","identified":false,"first_seen":"session-0.5"},"body":"The object the second group had been sent into [[Noannar's Hold]] to retrieve.\n\nA sahuagin caster used it to raise a pillar of seawater inside a sealed temple, from nothing. The water kept coming until the town was under it.\n\nSee [[Sahuagin and the Pillar]] and [[The Kraken Society]].\n\n> [!question] Where is it now? The notes do not say the party ever recovered it.","links":["Noannar's Hold","Sahuagin and the Pillar","The Kraken Society"]},{"name":"Coin of Tymora","kind":"item","tags":[],"props":{"type":"magic","status":"held","holder":"[[Cael]]","identified":true,"attuned":true,"first_seen":"pre-campaign"},"body":"Given to [[Cael]] by an old mentor from his road years, before [[Noannar's Hold]].\n\n**A hole through the middle.** The tails side is **smooth** — and it did not used to be. Something was on it once.\n\nIt has magical properties. \n1. When Invoke duplicity is cast you can swap position with the duplicate\n\n> [!question] What was on the smooth side, and where did it go?\n\n*Provenance beyond \"an old mentor\" is [[Cael]]'s own business and is not recorded here. See [[_Restricted/README]].*","links":["Cael","Noannar's Hold"]},{"name":"Memory Shards","kind":"item","tags":[],"props":{"type":"quest","status":"unclaimed","identified":false,"first_seen":"session-3"},"body":"Found inside the [[Vanishing Tower]]. The party's task is to bring back **as many as they can carry** — this is the price of the antidote.\n\nThey are [[The Professor]]'s data for [[Time as Memory]]. Things in the tower feed on memory, which suggests the shards are food as well as evidence.\n\n> [!question] Whose memories are they?","links":["Vanishing Tower","The Professor","Time as Memory"]},{"name":"Party Loot Ledger","kind":"dashboard","tags":["ledger"],"props":{},"body":"The party chest. Coin, and common loot not worth a note of its own — mostly coin.\n\n**Anything notable has its own note**, and who carries it lives in that note's `holder` property. `Items.base` renders that as a table, generated from the notes themselves, so it cannot fall out of date the way a hand-kept list does.\n\n## Coin\n\n| Amount | From |\n|---|---|\n| **36 gp** | field loot, Session 2 |\n| **9 pp** | [[Selda]] — 3 pp of it since spent, below |\n\nNot a running total. What the party held before Session 2 was never written down.\n\n## Common gear\n\nTaken off the [[The Unseen|Unseen]] war party in [[Session 2 - Marked by the Unseen|S2]] and not worth individual notes:\n\n- 3 heavy crossbows, with bolts\n- 3 hand axes\n- 3 short swords\n- 1 grappling hook and 50 ft of rope\n- 1 sabotage kit\n- 1 scroll of *blight* — from [[Selda]], carried by [[Lorien]]\n\n## Out\n\n- 3 pp and the party's horses &rarr; [[Dell]]'s caravan *(given by [[Lorien]], [[Session 3 - Trail of Hope|S3]])*\n\n## Pending\n\n- [[Memory Shards]] — the price of the antidote, not yet collected","links":["Selda","The Unseen","Session 2 - Marked by the Unseen","Lorien","Dell","Session 3 - Trail of Hope","Memory Shards"]},{"name":"Selda's Signet Ring","kind":"item","tags":[],"props":{"type":"mundane","status":"held","holder":"[[Lorien]]","identified":false,"origin":"[[Selda]]","first_seen":"session-2"},"body":"Taken from [[Selda]].\n\n> [!question] A signet is a house, a guild, or an office. She was fighting for a slum gang. **Whose ring is this?** Probably the strongest unexamined lead the party owns.","links":["Selda","Lorien"]},{"name":"Selda's Spellbook","kind":"item","tags":[],"props":{"type":"document","status":"held","holder":"[[Lorien]]","identified":false,"origin":"[[Selda]]","first_seen":"session-2"},"body":"Taken from [[Selda]], the high elf wizard who cast for [[The Unseen]].\n\nNot yet read on the page. Nobody has said what is in it.","links":["Selda","The Unseen","Lorien"]},{"name":"Sending Stone","kind":"item","tags":[],"props":{"type":"magic","status":"held","holder":"[[Cael]]","identified":true,"attuned":false,"origin":"[[Selda]]","first_seen":"session-2"},"body":"Taken from [[Selda]].\n\nSending stones come in pairs.\n\n> [!danger] Somebody holds the other one, and that somebody may have noticed when she stopped answering.","links":["Selda","Cael"]},{"name":"Silvio's Amulet","kind":"item","tags":[],"props":{"type":"quest","status":"held","holder":"[[Cael]]","identified":false,"origin":"[[Silvio]]","first_seen":"session-0.5"},"body":"Pressed into the party's hands by a dying gnome under a mountain of corpses at [[Noannar's Hold]].\n\n**Destination:** [[Silvio]]'s wife and three children, in **Silverymoon**.\n\nOpen since Session 0.5. See [[Promises & Debts]].","links":["Noannar's Hold","Silvio","Promises & Debts","Cael"]},{"name":"The Poison","kind":"item","tags":[],"props":{"type":"condition","status":"active","holder":"party","identified":false,"origin":"[[The Last Pint]]","first_seen":"session-2"},"body":"> [!danger] Still progressing.\n\nAdministered at [[The Last Pint]], the morning after the party's performance there.\n\n- [[The Knife]] traded **partial antidotes** for [[Devon Dale]]'s direction.\n- [[Cael]] has calmed the symptoms. He **has not stopped the progression**.\n- [[Elis]] in [[The Warrens]] was named as a possible source. Never pursued.\n- [[Vetel Kraye]] said the only real answer is a mage to the east. That mage is [[The Professor]], and he is brewing it now.\n\n**Nobody has named the poison.** Which means nobody has confirmed the cure is a cure.","links":["The Last Pint","The Knife","Devon Dale","Cael","Elis","The Warrens","Vetel Kraye","The Professor"]},{"name":"Torvin's Shield","kind":"item","tags":[],"props":{"type":"magic","status":"held","holder":"[[Cael]]","identified":true,"attuned":false,"origin":"[[Torvin]]","first_seen":"session-3"},"body":"An old family heirloom, given to [[Cael]] by [[Torvin]] for saving his daughter's life.\n\n**+1 AC · acid resistance**\n\n> [!question] It has been in a half-elf family in the [[Evermoors]] for generations and it grants acid resistance. Somebody's ancestor needed that.","links":["Cael","Torvin","Evermoors"]},{"name":"Unseen Rings & Bandages","kind":"item","tags":[],"props":{"type":"mundane","status":"held","holder":"[[Cael]]","identified":true,"origin":"[[The Unseen]]","first_seen":"session-2"},"body":"Taken from the [[The Unseen|Unseen]] war party in [[Session 2 - Marked by the Unseen|Session 2]].\n\nPer [[Tom Farow]]: **wear the ring and the bandages and you will be taken for a member.** Both are in the party's hands.\n\nAn unspent key into [[The Warrens]] and into whatever [[Reon Sahtar]] is running.","links":["The Unseen","Session 2 - Marked by the Unseen","Tom Farow","The Warrens","Reon Sahtar","Cael"]},{"name":"Cael's shift in time","kind":"thread","tags":[],"props":{"type":"mystery","heat":"warm","status":"active","opened":"session-3","involves":["[[Cael]]","[[Lorien]]","[[The Drawbridge]]","[[Time as Memory]]"]},"body":"**What we know:** While working the ropes of [[The Drawbridge]], inside [[Lorien]]'s chronurgy, [[Cael]] experienced a displacement in time. Brief, and wrong.\n\n**What we don't:** Whether it was the magic, the place, or him. Nobody has followed it up.\n\n**Who would know:** [[Lorien]], who has not been told. [[The Professor]], who holds that time is [[Time as Memory|made of memory]].\n\n**Cost of ignoring it:** Unknown, which is the problem.\n\n> [!cael] Cael\n> He has not mentioned it to Lorien. He is telling himself it was the magic.","links":["The Drawbridge","Lorien","Cael","The Professor","Time as Memory"]},{"name":"Curing the poison","kind":"thread","tags":[],"props":{"type":"threat","heat":"hot","status":"active","opened":"session-2","involves":["[[The Poison]]","[[The Professor]]","[[The Knife]]","[[Elis]]"]},"body":"**What we know:** The party was dosed at [[The Last Pint]] on the morning after their performance there. [[The Knife]] traded partial antidotes for the direction [[Devon Dale]] ran. [[Cael]] has brought the symptoms down and has not touched the progression. [[The Professor]] is brewing the real antidote as payment for the [[Vanishing Tower]] errand.\n\n**What we don't:** What the poison is. Nobody has named it, which means nobody has confirmed that what the Professor is brewing is a cure for it.\n\n**Who would know:** [[The Knife]], who supplied the partial. [[Elis]] in [[The Warrens]], named by [[Tom Farow]] and never pursued. Whoever administered it.\n\n**Cost of ignoring it:** Three of the party die.\n\n> [!danger] Still progressing under the calm. See [[The Poison]].","links":["The Last Pint","The Knife","Devon Dale","Cael","The Professor","Vanishing Tower","Elis","The Warrens","Tom Farow","The Poison"]},{"name":"Duskandale is too perfect","kind":"thread","tags":[],"props":{"type":"mystery","heat":"cold","status":"active","opened":"session-1","involves":["[[Duskandale]]","[[Corvan Vallen]]","[[House Vallen]]"]},"body":"**What we know:** Built by [[Corvan Vallen]] of [[House Vallen]]. Rich, peaceful, uniformly happy — the party's own word was *idyllic*. Its name exists in Common **and Elvish**, which struck them as odd at the time. [[Dell]]'s refugees were sent there.\n\n**What we don't:** Why the Elvish name. Nothing else in the village explains it. Nobody followed it up.\n\n**Who would know:** [[Corvan Vallen]]. [[House Vallen]], about which nothing is known because nobody has asked.\n\n**Cost of ignoring it:** [[Tak]] was hung there, [[Devon Dale]] was marked there, and the village knew none of it. Now a hundred refugees are walking into it.","links":["Corvan Vallen","House Vallen","Dell","Tak","Devon Dale","Duskandale"]},{"name":"Getting out past the horde","kind":"thread","tags":[],"props":{"type":"threat","heat":"hot","status":"active","opened":"session-3","involves":["[[The Orc Horde]]","[[The Orc Warleader]]","[[The Professor's Tower]]"]},"body":"**What we know:** Fifty to sixty [[The Orc Horde|orcs]], not all of them fighters, camped in [[Netheril|Netherese ruins]] around [[The Professor's Tower]]. Led by a towering female orc. The party went in invisible on a promise of safe passage to the door.\n\n**What we don't:** Why a horde carrying non-combatants is besieging one wizard's tower. Sieges are not what raiders do.\n\n**Who would know:** [[The Orc Warleader]], who has not been spoken to. [[The Professor]], who has not been asked.\n\n**Cost of ignoring it:** The party comes back through the rift carrying [[Memory Shards]] and walks into the same sixty orcs with invisibility already spent.","links":["The Orc Horde","Netheril","The Professor's Tower","The Orc Warleader","The Professor","Memory Shards"]},{"name":"Silvio's errand","kind":"thread","tags":[],"props":{"type":"promise","heat":"cold","status":"active","opened":"session-0.5","involves":["[[Silvio's Amulet]]","[[Silvio]]","[[Cael]]"]},"body":"**What we know:** A dying gnome pressed [[Silvio's Amulet]] into the party's hands beneath the dead at [[Noannar's Hold]] and asked that it reach **his wife and three children in Silverymoon.** [[Cael]] carries it.\n\n**What we don't:** Whether the family is still there. Nobody has been to Silverymoon.\n\n**Who would know:** Anyone in Silverymoon.\n\n**Cost of ignoring it:** Nothing external. It was freely promised to a man who died in their hands. See [[Promises & Debts]].","links":["Silvio's Amulet","Noannar's Hold","Cael","Promises & Debts","Silvio"]},{"name":"Tak is alive","kind":"thread","tags":[],"props":{"type":"mystery","heat":"warm","status":"active","opened":"session-1","involves":["[[Tak]]","[[Duskandale]]","[[The Ravensworth]]"]},"body":"**What we know:** In [[Session 1 - The Savage Daughter|S1]] a body hung outside the window at [[The Hearthstone]] and it was [[Tak]]'s; [[Cael]] steered [[Devon Dale]]'s eyes away from it. In [[Session 3 - Trail of Hope|S3]], on the road back for the horses, Cael saw Tak **alive**, talking to a gathered group.\n\n**What we don't:** Whether the body was someone else, whether it was ever a body, whether he was taken and returned, or whether he was theirs from the start. And who he was talking to.\n\n**Who would know:** Tak. Anyone still in [[Duskandale]].\n\n**Cost of ignoring it:** If he was theirs from the start, everything the party did in that village was watched.","links":["Session 1 - The Savage Daughter","The Hearthstone","Tak","Cael","Devon Dale","Session 3 - Trail of Hope","Duskandale","The Ravensworth"]},{"name":"The Circle and the Hand","kind":"thread","tags":[],"props":{"type":"mystery","heat":"warm","status":"active","opened":"session-1","involves":["[[The Ashrit Circle]]","[[The Hand of Yartar]]","[[Devon Dale]]","[[Brisk]]"]},"body":"**What we know:** [[Devon Dale]] had documents proving [[The Ashrit Circle]] — a fake resistance movement against [[Caldren Voss]] — is in league with [[The Hand of Yartar]]. She read from them at [[The Hearthstone]]. **Her allies took the files and left.** The party never read them.\n\n**What we don't:** What the Circle is actually gathering money and support for. What a poison-and-information guild wants with a fake resistance movement.\n\n**Who would know:** [[Brisk]], [[Sef]] and [[Fren]], who have the documents. Anyone inside either organisation — the party has met nobody from the Circle face to face.\n\n**Cost of ignoring it:** The Circle pays for assassins and is patient.","links":["Devon Dale","The Ashrit Circle","Caldren Voss","The Hand of Yartar","The Hearthstone","Brisk","Sef","Fren"]},{"name":"The Elis lead","kind":"thread","tags":[],"props":{"type":"quest","heat":"cold","status":"active","opened":"session-2","involves":["[[Elis]]","[[The Warrens]]","[[Tom Farow]]","[[The Poison]]"]},"body":"**What we know:** [[Tom Farow]] named [[Elis]], a potion mistress findable in [[The Warrens]] of [[Yartar]], as a possible source of an antidote. He was explicit that it was not a sure bet.\n\n**What we don't:** Whether she exists, whether she can help, and what she would want for it.\n\n**Who would know:** [[Tom Farow]], who talked freely and then vanished. Anyone in the Warrens.\n\n**Cost of ignoring it:** Nothing yet — but it is a live second option on the poison, and nobody knows the party holds it.","links":["Tom Farow","Elis","The Warrens","Yartar","The Poison"]},{"name":"The Kraken's promise","kind":"thread","tags":[],"props":{"type":"threat","heat":"cold","status":"active","opened":"session-0.5","involves":["[[The Kraken Society]]","[[The KrakenWizard]]","[[Blue Gem]]"]},"body":"**What we know:** A sahuagin caster used the [[Blue Gem]] to raise the pillar that drowned [[Noannar's Hold]]. [[The KrakenWizard]] named [[The Kraken Society]] as he died and promised the party would regret interfering.\n\n**What we don't:** Where the gem is now — the notes do not say the party recovered it. Who wanted the Hold underwater. Whether there are other gems.\n\n**Who would know:** The Society. Nobody the party can currently reach.\n\n**Cost of ignoring it:** Nothing has come of the promise yet. That is not the same as nothing coming of it.","links":["Blue Gem","Noannar's Hold","The KrakenWizard","The Kraken Society"]},{"name":"The Professor's stability","kind":"thread","tags":[],"props":{"type":"threat","heat":"warm","status":"active","opened":"session-3","involves":["[[The Professor]]","[[Lorien]]","[[Vanishing Tower]]","[[Beat]]"]},"body":"**What we know:** He is working to close the rifts between the material realm and the [[Vanishing Tower]]. He also keeps sending people *into* it to prove that time is a collection of memories. He was [[Lorien]]'s mentor. He does not look stable. He is holding the party's antidote and is alone with it.\n\n**What we don't:** Which of the two projects is the real one. His name. What he does when he finds out [[Beat]] opened his laboratory for strangers.\n\n**Who would know:** [[Lorien]], who studied under him and has not volunteered much.\n\n**Cost of ignoring it:** He is the only source of the cure, and the party is not in the room.\n\n> [!danger] Brewing the only antidote the party has access to, unwatched, while they are in another realm.","links":["Vanishing Tower","Lorien","Beat","The Professor"]},{"name":"The burned Waterbaron","kind":"thread","tags":[],"props":{"type":"mystery","heat":"cold","status":"active","opened":"session-1","involves":["[[Caldren Voss]]","[[Yartar]]","[[Ironspike Bridge]]"]},"body":"**What we know:** [[Caldren Voss]] took [[Yartar]] by coup. He executed his predecessor — a woman — and burned her. **Her handprint is still on the side of the bridge.**\n\n**What we don't:** Her name. Nobody has told the party.\n\n**Who would know:** Anyone in [[Yartar]] old enough. The registries in [[High Ward]].\n\n**Cost of ignoring it:** A city with a martyr it does not name has people who remember her.","links":["Caldren Voss","Yartar","High Ward","Ironspike Bridge"]},{"name":"Where Devon went","kind":"thread","tags":[],"props":{"type":"quest","heat":"hot","status":"active","opened":"session-2","involves":["[[Devon Dale]]","[[Vetel Kraye]]","[[The Knife]]","[[The Songbird]]","[[Rennik Dale]]"]},"body":"**What we know:** [[Cael]] wore her face out of [[Duskandale]] so she could run invisible under her own. [[Vetel Kraye]] was her extraction — a griffon, and a way out. **She never arrived.** [[The Knife]] and [[The Songbird]] went after her with a direction the party gave them.\n\n**What we don't:** Whether she is alive. Whether the trade bought anything at all.\n\n**Who would know:** The [[The Ravensworth|Ravensworth]] siblings. [[Brisk]], [[Sef]] and [[Fren]], who left with the files and have not been seen since.\n\n**Cost of ignoring it:** This is the job. [[Rennik Dale]] is owed an answer either way.\n\n> [!cael] Cael\n> He took her place so she could run. If she died anyway, the trade bought nothing. He would like to know which it was, and he is not sure he wants to know.","links":["Cael","Duskandale","Vetel Kraye","The Knife","The Songbird","The Ravensworth","Brisk","Sef","Fren","Rennik Dale","Devon Dale"]},{"name":"Whose name is Ravensworth","kind":"thread","tags":[],"props":{"type":"mystery","heat":"cold","status":"active","opened":"session-3","involves":["[[The Ravensworth]]","[[The Knife]]","[[The Songbird]]"]},"body":"**What we know:** The siblings' real names are **[[Doman Vein]]** and **[[Iskra Vein]]**, learned in [[Session 3 - Trail of Hope|S3]]. So *Ravensworth* is not a family name.\n\n**What we don't:** Whether it is a title, an epithet, a company, or a house they work for.\n\n**Who would know:** The siblings. Anyone in assassin circles, where they are legends.\n\n**Cost of ignoring it:** If Ravensworth is a house rather than a nickname, there are more of them.","links":["Session 3 - Trail of Hope","The Ravensworth","The Knife","The Songbird"]}];

/* ---------- kind config: which properties matter, and in what order ---------- */
const KINDS = [
  ["all","Everything"],["thread","Threads"],["npc","People"],["location","Places"],
  ["faction","Factions"],["item","Items"],["lore","Lore"],["session","Sessions"],
  ["party","Party"],["dashboard","Boards"]
];
const KEYPROPS = {
  npc:["tier","status","disposition","bound_to","faction","based","species","gender","last_seen","first_seen","aliases","name_confirmed","source","class","subclass"],
  location:["type","status","danger","access","parent","controlled_by","last_visited","first_seen"],
  faction:["type","status","threat","disposition","base","leader","members","first_seen","name_confirmed"],
  item:["type","status","holder","identified","attuned","origin","first_seen"],
  lore:["type","confidence","source","first_seen"],
  thread:["type","heat","status","opened","involves"],
  session:["session","title","pcs","locations","npcs"],
  party:["species","class","subclass","pact","familiar","status","based","player_character","first_seen","last_seen"],
  dashboard:["updated"]
};
/* two properties shown in the index row, per kind */
const ROWPROPS = {
  npc:["tier","status","disposition"], location:["type","danger","access"],
  faction:["threat","disposition","status"], item:["status","holder","identified"],
  lore:["confidence","source"], thread:["heat","type"],
  session:["session"], party:["class","status"], dashboard:[]
};

const CRIT = new Set(["hostile","deadly","dead","missing","presumed-dead","destroyed","barred","hot","high"]);
const WARN = new Set(["unknown","watched","risky","cold","damaged","abandoned","restricted","warm","wary","lost","reported","theory","disputed","false"]);
const OK   = new Set(["ally","friendly","employer","safe","intact","alive","open","held","active","established","true","none"]);

function sev(v){
  const s = String(v).toLowerCase();
  if (CRIT.has(s)) return "crit";
  if (WARN.has(s)) return "warn";
  if (OK.has(s)) return "ok";
  return "";
}
function rowSev(n){
  const order = ["crit","warn","ok"];
  let best = "";
  for (const k of (ROWPROPS[n.kind]||[])){
    const s = sev(n.props[k]);
    if (s && (!best || order.indexOf(s) < order.indexOf(best))) best = s;
  }
  return best;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flat = v => Array.isArray(v) ? v.map(flat).join(", ") : String(v).replace(/\[\[([^\]|]+)(\|([^\]]+))?\]\]/g, (m,a,b,c)=>c||a.split("/").pop());

const BY_NAME = new Map(DATA.map(n => [n.name, n]));

/* ---------- state ---------- */
let kind = "all", query = "", facet = null, current = null, board = null;

/* ---------- search ---------- */
function haystack(n){
  if (n._h) return n._h;
  const props = Object.entries(n.props).map(([k,v]) => k + " " + flat(v)).join(" ");
  n._h = (n.name + " " + n.kind + " " + props + " " + n.body).toLowerCase();
  return n._h;
}
function terms(){ return query.toLowerCase().split(/\s+/).filter(Boolean); }
function matches(n){
  const t = terms();
  if (!t.length) return true;
  const h = haystack(n);
  return t.every(w => h.includes(w));
}
function filtered(){
  return DATA.filter(n => {
    if (kind !== "all" && n.kind !== kind) return false;
    if (facet && flat(n.props[facet.k] ?? "").toLowerCase() !== facet.v.toLowerCase()) return false;
    return matches(n);
  });
}
function hl(text){
  const t = terms();
  let out = esc(text);
  for (const w of t){
    if (w.length < 2) continue;
    out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi"), "<mark>$1</mark>");
  }
  return out;
}
function snippet(n){
  const t = terms();
  const plain = n.body.replace(/[#*>`\[\]|-]/g," ").replace(/\s+/g," ").trim();
  if (!t.length) return plain.slice(0,120);
  const i = plain.toLowerCase().indexOf(t[0]);
  if (i < 0) return plain.slice(0,120);
  return (i > 40 ? "&hellip;" : "") + plain.slice(Math.max(0,i-40), Math.max(0,i-40)+150);
}

/* ---------- markdown ---------- */
function inline(s){
  return esc(s)
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, (m,tgt,alias) => {
      const clean = tgt.split("/").pop().trim();
      const label = alias || clean;
      return BY_NAME.has(clean)
        ? '<a class="wl" data-go="' + esc(clean) + '">' + esc(label) + "</a>"
        : '<a class="dead" title="not in this vault">' + esc(label) + "</a>";
    })
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(src){
  const lines = src.split("\n");
  let out = "", i = 0;
  const CT = {cael:"Cael", question:"Open question", danger:"Live threat", info:"Note"};
  while (i < lines.length){
    const L = lines[i];
    if (!L.trim()){ i++; continue; }
    let m;
    if ((m = L.match(/^>\s*\[!(\w+)\]\s*(.*)$/))){
      const t = m[1].toLowerCase();
      let buf = m[2] ? [m[2]] : [];
      i++;
      while (i < lines.length && /^>/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,"")); i++; }
      const inner = buf.join("\n").trim();
      out += '<div class="cal cal-' + esc(t) + '"><div class="ct">' + esc(CT[t] || t) +
             '</div><div class="md-in">' + (inner ? md(inner) : "") + "</div></div>";
      continue;
    }
    if ((m = L.match(/^(#{2,4})\s+(.*)$/))){
      const lv = Math.min(m[1].length, 3);
      out += "<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"; i++; continue;
    }
    if (/^\s*[-*]\s+/.test(L)){
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++; }
      out += "<ul>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>"; continue;
    }
    if (/^\s*\d+\.\s+/.test(L)){
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+\.\s+/,"")); i++; }
      out += "<ul>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>"; continue;
    }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      const cells = r => r.replace(/^\||\|$/g,"").split(/(?<!\\)\|/).map(c => c.replace(/\\\|/g,"|").trim());
      const head = cells(L); i += 2;
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out += '<div class="tablewrap"><table><thead><tr>' + head.map(h => "<th>" + inline(h) + "</th>").join("") +
             "</tr></thead><tbody>" + rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
             "</tbody></table></div>";
      continue;
    }
    if (/^---+$/.test(L.trim())){ out += "<hr>"; i++; continue; }
    let para = [];
    while (i < lines.length && lines[i].trim() && !/^[#>|]|^\s*[-*]\s|^\s*\d+\.\s|^---+$/.test(lines[i])){ para.push(lines[i]); i++; }
    if (para.length) out += "<p>" + inline(para.join(" ")) + "</p>";
  }
  return out;
}

/* ---------- render: chips ---------- */
function renderKinds(){
  document.getElementById("kinds").innerHTML = KINDS.map(([k,label]) => {
    const n = k === "all" ? DATA.length : DATA.filter(d => d.kind === k).length;
    if (!n) return "";
    return '<button class="chip" type="button" data-kind="' + k + '" aria-pressed="' + (kind===k) + '">' +
           esc(label) + '<span class="n">' + n + "</span></button>";
  }).join("");
}
const FACETABLE = {npc:["tier","status","disposition"], location:["type","danger","access"],
  faction:["threat","disposition"], item:["type","status","identified"],
  lore:["confidence"], thread:["heat","type"], party:[], session:[], dashboard:[]};
function renderFacets(){
  const el = document.getElementById("facets");
  const keys = FACETABLE[kind] || [];
  if (!keys.length){ el.innerHTML = ""; return; }
  let html = "";
  for (const k of keys){
    const vals = [...new Set(DATA.filter(d => d.kind === kind && d.props[k] != null).map(d => flat(d.props[k])))].sort();
    if (vals.length < 2) continue;
    html += '<span class="facetlabel">' + esc(k.replace(/_/g," ")) + "</span>";
    html += vals.map(v => {
      const on = facet && facet.k === k && facet.v === v;
      return '<button class="chip facet" type="button" data-fk="' + esc(k) + '" data-fv="' + esc(v) +
             '" aria-pressed="' + on + '">' + esc(v) + "</button>";
    }).join("");
  }
  el.innerHTML = html;
}

/* ---------- render: index ---------- */
function renderIndex(){
  const list = filtered();
  document.getElementById("hits").textContent = list.length + (list.length === 1 ? " result" : " results");
  const el = document.getElementById("index");
  if (!list.length){
    el.innerHTML = '<div class="empty">Nothing matches that.<br>Try a shorter word, or clear the filters.</div>';
    return;
  }
  const order = {thread:0, npc:1, party:2, faction:3, location:4, item:5, lore:6, session:7, dashboard:8};
  const t = terms();
  if (t.length){
    /* a lookup tool ranks by how well the NAME matches, not by category */
    const score = n => {
      const nm = n.name.toLowerCase();
      const joined = t.join(" ");
      let s = 0;
      if (nm === joined) s += 1000;
      else if (nm.startsWith(joined)) s += 600;
      else if (nm.includes(joined)) s += 400;
      if (t.every(w => nm.includes(w))) s += 200;
      else if (t.some(w => nm.includes(w))) s += 90;
      const props = Object.values(n.props).map(flat).join(" ").toLowerCase();
      if (t.some(w => props.includes(w))) s += 40;
      /* a shorter name containing the query is the more precise hit:
         "The Professor" beats "The Professor's stability" */
      s += Math.max(0, 60 - nm.length);
      s += Math.max(0, 20 - (order[n.kind] ?? 9));
      return s;
    };
    list.sort((a,b) => score(b)-score(a) || a.name.localeCompare(b.name));
  } else {
    list.sort((a,b) => (order[a.kind]-order[b.kind]) || a.name.localeCompare(b.name));
  }
  el.innerHTML = list.map(n => {
    const props = (ROWPROPS[n.kind]||[]).filter(k => n.props[k] != null)
      .map(k => '<span class="pv">' + esc(k.replace(/_/g," ")) + " <b>" + esc(flat(n.props[k])) + "</b></span>").join("");
    return '<button class="row ' + rowSev(n) + '" type="button" data-go="' + esc(n.name) + '" aria-current="' + (current===n.name) + '">' +
      '<span class="stripe"></span><span class="rbody">' +
      '<span class="rname">' + hl(n.name) + "</span>" +
      '<span class="rmeta"><span class="kindtag">' + esc(n.kind) + "</span>" + props + "</span>" +
      (query ? '<span class="snip">' + hl(snippet(n).replace(/&hellip;/g,"…")) + "</span>" : "") +
      "</span></button>";
  }).join("");
}

/* ---------- render: detail ---------- */
function detailBar(title){
  return '<div class="detailbar">' +
    '<button class="bk" type="button" id="back" aria-label="Back to the index">&larr;</button>' +
    '<span class="bt">' + esc(title) + "</span>" +
    '<button class="tm" type="button" id="tablemode2">Table</button></div>';
}
function renderDetail(){
  const el = document.getElementById("detail");
  if (board){
    el.innerHTML = detailBar(BOARDS.reduce((a,b)=>b[0]===board?b[1]:a,"")) + renderBoard(board);
    el.scrollTop = 0; window.scrollTo(0,0); return;
  }
  const n = current && BY_NAME.get(current);
  if (!n){
    el.innerHTML = '<div class="placeholder"><h2>What do you need?</h2>' +
      "<p>Type any name, place, faction or object into the search bar. Everything in the vault is indexed &mdash; " +
      "properties and full note text alike, so &ldquo;caravan&rdquo; finds Dell and &ldquo;griffon&rdquo; finds Vetel Kraye.</p>" +
      "<ul>" +
      "<li>The <strong>Boards</strong> above answer the standing questions in one click &mdash; inventory, hot threads, who is missing.</li>" +
      "<li>Coloured stripes flag state at a glance: <strong>red</strong> hostile, dead or deadly &middot; <strong>brass</strong> unknown or watched &middot; <strong>blue</strong> allied or safe.</li>" +
      "<li>Every <span style=\"color:var(--river)\">linked name</span> inside a note is clickable.</li>" +
      "<li>Press <kbd>/</kbd> to jump to search, <kbd>Esc</kbd> to clear it.</li>" +
      "</ul></div>";
    return;
  }
  const keys = KEYPROPS[n.kind] || Object.keys(n.props);
  const seen = new Set(keys);
  const allKeys = keys.filter(k => n.props[k] != null).concat(Object.keys(n.props).filter(k => !seen.has(k)));
  const props = allKeys.map(k => {
    const v = flat(n.props[k]);
    const s = sev(v);
    return '<span class="prop' + (s ? " p-" + s : "") + '">' + esc(k.replace(/_/g," ")) + " <b>" + esc(v) + "</b></span>";
  }).join("");
  const back = BY_NAME.has(n.name) ? DATA.filter(d => d.links.includes(n.name)).map(d => d.name) : [];
  const rel = [...new Set(n.links.concat(back))];
  el.innerHTML =
    detailBar(n.name) +
    '<div class="dhead"><div class="dkind">' + esc(n.kind) + "</div>" +
    '<h1 class="dname">' + esc(n.name) + "</h1>" +
    '<div class="props">' + props + "</div></div>" +
    '<div class="tmnote">Table mode is on. Cael\'s margin notes are hidden &mdash; his opinions, and the handful of things he has not said out loud.</div>' +
    '<div class="md">' + md(n.body) + "</div>" +
    (rel.length ? '<div class="related"><h4>Connected</h4><div class="rellist">' +
      rel.map(r => "<button type=\"button\" data-go=\"" + esc(r) + "\">" + esc(r) + "</button>").join("") +
      "</div></div>" : "");
  el.scrollTop = 0;
}

/* ---------- boards ---------- */
const BOARDS = [
  ["inventory","Party Inventory"],["hot","Hot Threads"],["missing","Unaccounted For"],
  ["standing","Who Stands Where"],["danger","Dangerous Ground"],["belief","On Whose Word"]
];
function tbl(head, rows){
  return '<div class="tablewrap"><table><thead><tr>' + head.map(h => "<th>" + esc(h) + "</th>").join("") +
    "</tr></thead><tbody>" + rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") +
    "</tbody></table></div>";
}
const lk = n => BY_NAME.has(n) ? '<a class="wl" data-go="' + esc(n) + '">' + esc(n) + "</a>" : esc(n);
const pill = v => { const s = sev(v); return '<span class="prop' + (s?" p-"+s:"") + '"><b>' + esc(v) + "</b></span>"; };

function renderBoard(id){
  const items = DATA.filter(d => d.kind === "item");
  const npcs = DATA.filter(d => d.kind === "npc");
  const H = (t,s,inner) => '<div class="boardview"><h2>' + t + '</h2><p class="bsub">' + s + "</p>" + inner + "</div>";

  if (id === "inventory"){
    const held = items.filter(i => flat(i.props.status||"") === "held");
    const groups = {};
    held.forEach(i => { const h = flat(i.props.holder || "unassigned"); (groups[h] = groups[h] || []).push(i); });
    let out = "";
    for (const h of Object.keys(groups).sort()){
      out += '<div class="grp"><h3>' + esc(h) + "</h3>" + tbl(["Item","Type","Identified","From"],
        groups[h].map(i => [lk(i.name), esc(flat(i.props.type||"—")),
          pill(flat(i.props.identified ?? "unknown")), i.props.origin ? lk(flat(i.props.origin)) : "—"])) + "</div>";
    }
    const other = items.filter(i => flat(i.props.status||"") !== "held");
    if (other.length) out += '<div class="grp"><h3>Not in our hands</h3>' + tbl(["Item","Status","Type"],
      other.map(i => [lk(i.name), pill(flat(i.props.status||"?")), esc(flat(i.props.type||"—"))])) + "</div>";
    return H("Party Inventory", "Everything the party is carrying, by holder &mdash; plus what is out there and not theirs.", out);
  }
  if (id === "hot"){
    const th = DATA.filter(d => d.kind === "thread");
    const heats = ["hot","warm","cold"];
    let out = "";
    for (const h of heats){
      const g = th.filter(t => flat(t.props.heat||"") === h);
      if (!g.length) continue;
      out += '<div class="grp"><h3>' + esc(h) + "</h3>" + tbl(["Thread","Kind","Opened"],
        g.map(t => [lk(t.name), esc(flat(t.props.type||"—")), esc(flat(t.props.opened||"—"))])) + "</div>";
    }
    return H("Open Threads", "Everything unresolved, by how much it is likely to hurt.", out);
  }
  if (id === "missing"){
    const g = npcs.filter(n => ["unknown","missing","presumed-dead"].includes(flat(n.props.status||"")));
    return H("Unaccounted For", "People whose whereabouts or fate the party does not know.",
      tbl(["Name","Status","Tier","Last seen","Last known"],
        g.map(n => [lk(n.name), pill(flat(n.props.status)), esc(flat(n.props.tier||"—")),
          esc(flat(n.props.last_seen||"—")), n.props.based ? lk(flat(n.props.based)) : "—"])));
  }
  if (id === "standing"){
    const f = DATA.filter(d => d.kind === "faction");
    let out = '<div class="grp"><h3>Factions</h3>' + tbl(["Faction","Toward us","Threat","Leader","Base"],
      f.map(x => [lk(x.name), pill(flat(x.props.disposition||"unknown")), pill(flat(x.props.threat||"unknown")),
        x.props.leader ? lk(flat(x.props.leader)) : "—", x.props.base ? lk(flat(x.props.base)) : "—"])) + "</div>";
    const allies = npcs.filter(n => ["ally","friendly","employer"].includes(flat(n.props.disposition||"")));
    const foes = npcs.filter(n => flat(n.props.disposition||"") === "hostile");
    out += '<div class="grp"><h3>On our side</h3>' + tbl(["Name","Standing","Where","Faction"],
      allies.map(n => [lk(n.name), pill(flat(n.props.disposition)), n.props.based ? lk(flat(n.props.based)) : "—",
        n.props.faction ? lk(flat(n.props.faction)) : "—"])) + "</div>";
    out += '<div class="grp"><h3>Against us</h3>' + tbl(["Name","Faction","Where","Last seen"],
      foes.map(n => [lk(n.name), n.props.faction ? lk(flat(n.props.faction)) : "—",
        n.props.based ? lk(flat(n.props.based)) : "—", esc(flat(n.props.last_seen||"—"))])) + "</div>";
    return H("Who Stands Where", "Factions and people, sorted by which way they are pointed.", out);
  }
  if (id === "danger"){
    const g = DATA.filter(d => d.kind === "location" &&
      ["risky","deadly","watched"].includes(flat(d.props.danger||"")));
    return H("Dangerous Ground", "Where it is risky to go, and why. A place can be intact, open and still lethal &mdash; the building is not the threat, the company is.",
      tbl(["Place","Danger","Status","Access","Held by"],
        g.map(n => [lk(n.name), pill(flat(n.props.danger)), esc(flat(n.props.status||"—")),
          pill(flat(n.props.access||"unknown")), n.props.controlled_by ? lk(flat(n.props.controlled_by)) : "—"])));
  }
  if (id === "belief"){
    const g = DATA.filter(d => d.props.confidence || d.props.source);
    return H("On Whose Word", "What the party believes, and who told them. Half of what they know came from an assassin, a prisoner and a stranger.",
      tbl(["Note","Confidence","Source","Kind"],
        g.map(n => [lk(n.name), pill(flat(n.props.confidence||"—")),
          n.props.source ? lk(flat(n.props.source)) : "—", esc(n.kind)])));
  }
  return "";
}
function renderBoards(){
  document.getElementById("boards").innerHTML = BOARDS.map(([id,label]) =>
    '<button class="board" type="button" data-board="' + id + '" aria-pressed="' + (board===id) + '">' + esc(label) + "</button>"
  ).join("");
}

/* ---------- events ---------- */
const isPhone = () => window.innerWidth <= 700;
function enterDetail(){
  if (isPhone()){
    document.documentElement.classList.add("viewing");
    document.documentElement.classList.remove("filters-open");
    document.getElementById("filterbtn").setAttribute("aria-expanded","false");
    window.scrollTo(0,0);
  } else if (window.innerWidth <= 880){
    document.getElementById("index").classList.add("hide-m");
  }
}
function leaveDetail(){
  document.documentElement.classList.remove("viewing");
  document.getElementById("index").classList.remove("hide-m");
  window.scrollTo(0,0);
}
function go(name){
  current = name; board = null;
  renderBoards(); renderIndex(); renderDetail(); enterDetail();
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ go(g.dataset.go); return; }
  const k = e.target.closest("[data-kind]");
  if (k){ kind = k.dataset.kind; facet = null; renderKinds(); renderFacets(); renderIndex(); renderFilterCount(); return; }
  const f = e.target.closest("[data-fk]");
  if (f){
    const same = facet && facet.k === f.dataset.fk && facet.v === f.dataset.fv;
    facet = same ? null : {k:f.dataset.fk, v:f.dataset.fv};
    renderFacets(); renderIndex(); renderFilterCount(); return;
  }
  const b = e.target.closest("[data-board]");
  if (b){
    board = board === b.dataset.board ? null : b.dataset.board;
    current = null; renderBoards(); renderDetail();
    if (board) enterDetail(); else leaveDetail();
    return;
  }
  if (e.target.closest("#back")){ leaveDetail(); return; }
  const fb = e.target.closest("#filterbtn");
  if (fb){
    const open = document.documentElement.classList.toggle("filters-open");
    fb.setAttribute("aria-expanded", String(open));
    return;
  }
  if (e.target.closest("#tablemode") || e.target.closest("#tablemode2")){
    const on = document.documentElement.classList.toggle("table-mode");
    document.getElementById("tablemode").setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("yartar-table-mode", on ? "1" : "0"); } catch (err) {}
    return;
  }
  if (e.target.closest("#theme")){
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
    return;
  }
});
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => {
  query = qEl.value.trim();
  if (query && board){ board = null; renderBoards(); renderDetail(); }
  if (query) leaveDetail();
  renderIndex();
});
function renderFilterCount(){
  const n = (kind !== "all" ? 1 : 0) + (facet ? 1 : 0);
  const el = document.getElementById("fcount");
  if (el) el.textContent = n ? String(n) : "";
}
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
  if (e.key === "Escape" && document.activeElement === qEl){ qEl.value = ""; query = ""; renderIndex(); }
});

try {
  if (localStorage.getItem("yartar-table-mode") === "1"){
    document.documentElement.classList.add("table-mode");
    document.getElementById("tablemode").setAttribute("aria-pressed","true");
  }
} catch (err) {}

renderKinds(); renderFacets(); renderBoards(); renderIndex(); renderDetail(); renderFilterCount();
</script>
