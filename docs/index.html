<title>Yartar Vault Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#E9EBEA; --paper:#F4F5F4; --raise:#FFFFFF;
  --ink:#14181B; --slate:#59656E; --faint:#8A949B;
  --rule:#D2D7D7; --rule-soft:#E0E4E3;
  --brass:#A06A21; --brass-soft:#EFE2CC;
  --river:#2C5666; --river-soft:#DCE7EA;
  --oxblood:#8A2E2E; --oxblood-soft:#F0DCDA;
  --shadow:0 1px 2px rgba(20,24,27,.06),0 8px 24px -12px rgba(20,24,27,.18);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101518; --paper:#161D21; --raise:#1C252A;
    --ink:#E2E7E9; --slate:#96A3AB; --faint:#6C797F;
    --rule:#2A353B; --rule-soft:#212A2F;
    --brass:#D6A05E; --brass-soft:#3A2E1D;
    --river:#7FB4C6; --river-soft:#1C2F36;
    --oxblood:#D2706E; --oxblood-soft:#38201F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#101518; --paper:#161D21; --raise:#1C252A;
  --ink:#E2E7E9; --slate:#96A3AB; --faint:#6C797F;
  --rule:#2A353B; --rule-soft:#212A2F;
  --brass:#D6A05E; --brass-soft:#3A2E1D;
  --river:#7FB4C6; --river-soft:#1C2F36;
  --oxblood:#D2706E; --oxblood-soft:#38201F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--river); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- command bar ---------- */
.bar{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--rule); padding:14px 20px 0;
}
.bar-top{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:12px}
.wordmark{font-family:var(--serif); font-size:27px; line-height:1; letter-spacing:.01em}
.wordmark em{font-style:italic; color:var(--brass)}
.tagline{font-size:12.5px; color:var(--faint); letter-spacing:.02em}
.spacer{flex:1}
.themebtn{
  font:500 11px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  background:none; border:1px solid var(--rule); color:var(--slate);
  padding:7px 11px; border-radius:2px; cursor:pointer;
}
.themebtn:hover{border-color:var(--brass); color:var(--brass)}
.themebtn[aria-pressed="true"]{background:var(--brass); border-color:var(--brass); color:#fff}
:root[data-theme="dark"] .themebtn[aria-pressed="true"],
:root:not([data-theme="light"]) .themebtn[aria-pressed="true"]{color:#1A1206}

.searchrow{display:flex; gap:10px; align-items:stretch; margin-bottom:12px}
.searchwrap{position:relative; flex:1; min-width:0}
#q{
  width:100%; font-family:var(--sans); font-size:16px; color:var(--ink);
  background:var(--raise); border:1px solid var(--rule); border-radius:2px;
  padding:11px 13px 11px 36px;
}
#q::placeholder{color:var(--faint)}
#q:focus{border-color:var(--river); outline:none; box-shadow:0 0 0 3px var(--river-soft)}
.searchwrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint)}
.hits{
  font:500 11px/1 var(--mono); color:var(--faint); align-self:center;
  white-space:nowrap; letter-spacing:.06em;
}

.chips{display:flex; gap:6px; flex-wrap:wrap; padding-bottom:12px}
.chip{
  font:500 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase;
  background:transparent; border:1px solid var(--rule); color:var(--slate);
  padding:7px 10px; border-radius:2px; cursor:pointer; white-space:nowrap;
}
.chip:hover{border-color:var(--slate); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}
.chip .n{opacity:.55; margin-left:5px}
.chip.facet[aria-pressed="true"]{background:var(--brass); border-color:var(--brass); color:#fff}
:root[data-theme="dark"] .chip.facet[aria-pressed="true"],
:root:not([data-theme="light"]) .chip.facet[aria-pressed="true"]{color:#1A1206}
.facets{display:flex; gap:6px; flex-wrap:wrap; padding-bottom:12px; border-top:1px dashed var(--rule-soft); padding-top:11px}
.facets:empty{display:none}
.facetlabel{font:500 10px/22px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-right:2px}

/* ---------- boards ---------- */
.boards{display:flex; gap:6px; flex-wrap:wrap; padding:11px 0 12px; border-top:1px dashed var(--rule-soft)}
.filterbtn{display:none}
.board{
  font:600 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase;
  background:var(--raise); border:1px solid var(--rule); color:var(--slate);
  padding:8px 11px; border-radius:2px; cursor:pointer;
}
.board:hover{border-color:var(--brass); color:var(--brass)}
.board[aria-pressed="true"]{background:var(--brass-soft); border-color:var(--brass); color:var(--brass)}

/* ---------- workspace ---------- */
.work{display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:0; align-items:start}
.index{
  border-right:1px solid var(--rule); min-height:calc(100vh - 190px);
  max-height:calc(100vh - 190px); overflow-y:auto; background:var(--ground);
}
.row{
  display:grid; grid-template-columns:3px 1fr; gap:0; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid var(--rule-soft);
  cursor:pointer; font-family:inherit; color:inherit; padding:0;
}
.row:hover{background:var(--paper)}
.row[aria-current="true"]{background:var(--raise)}
.row[aria-current="true"] .rname{color:var(--river)}
.stripe{background:var(--rule)}
.row.crit .stripe{background:var(--oxblood)}
.row.warn .stripe{background:var(--brass)}
.row.ok .stripe{background:var(--river)}
.rbody{padding:11px 14px; min-width:0}
.rname{font-family:var(--serif); font-size:19px; line-height:1.2; display:block; margin-bottom:3px; text-wrap:balance}
.rmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.kindtag{font:500 9.5px/1 var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--faint)}
.pv{font:400 11.5px/1.4 var(--mono); color:var(--slate)}
.pv b{font-weight:600; color:var(--ink)}
.snip{font-size:12.5px; color:var(--slate); margin-top:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.snip mark, .rname mark{background:var(--brass-soft); color:inherit; padding:0 1px; border-radius:2px}
.empty{padding:40px 20px; color:var(--faint); text-align:center; font-size:14px}

/* ---------- detail ---------- */
.detail{
  padding:28px 34px 80px; max-height:calc(100vh - 190px); overflow-y:auto;
  background:var(--paper);
}
.dhead{border-bottom:1px solid var(--rule); padding-bottom:16px; margin-bottom:20px}
.dkind{font:600 10px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--brass); margin-bottom:8px}
h1.dname{font-family:var(--serif); font-weight:400; font-size:42px; line-height:1.05; margin:0 0 14px; text-wrap:balance; letter-spacing:.005em}
.props{display:flex; gap:6px; flex-wrap:wrap}
.prop{
  font:400 11.5px/1 var(--mono); background:var(--raise); border:1px solid var(--rule);
  border-radius:2px; padding:6px 9px; color:var(--slate); font-variant-numeric:tabular-nums;
}
.prop b{font-weight:600; color:var(--ink); margin-left:5px}
.prop.p-crit{border-color:var(--oxblood); background:var(--oxblood-soft)} .prop.p-crit b{color:var(--oxblood)}
.prop.p-warn{border-color:var(--brass); background:var(--brass-soft)} .prop.p-warn b{color:var(--brass)}
.prop.p-ok{border-color:var(--river); background:var(--river-soft)} .prop.p-ok b{color:var(--river)}

.md{max-width:66ch; font-size:15.5px}
.md h2{font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.15; margin:30px 0 10px; text-wrap:balance}
.md h3{font:600 13px/1.3 var(--sans); letter-spacing:.05em; text-transform:uppercase; color:var(--slate); margin:24px 0 8px}
.md p{margin:0 0 13px}
.md ul{margin:0 0 13px; padding-left:19px} .md li{margin-bottom:5px}
.md strong{font-weight:600}
.md em{font-style:italic}
.md code{font:400 13px var(--mono); background:var(--raise); border:1px solid var(--rule); border-radius:2px; padding:1px 5px}
.md hr{border:none; border-top:1px solid var(--rule); margin:26px 0}
.md a.wl{color:var(--river); text-decoration:none; border-bottom:1px solid var(--river-soft); cursor:pointer}
.md a.wl:hover{border-bottom-color:var(--river); background:var(--river-soft)}
.md a.dead{color:var(--faint); border-bottom:1px dotted var(--rule); cursor:default}
.tablewrap{overflow-x:auto; margin:0 0 16px; border:1px solid var(--rule); border-radius:2px; background:var(--raise)}
.md table{border-collapse:collapse; width:100%; font-size:13.5px}
.md th{
  font:600 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  text-align:left; padding:10px 13px; border-bottom:1px solid var(--rule); white-space:nowrap;
}
.md td{padding:9px 13px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
.md tr:last-child td{border-bottom:none}

.cal{border-left:2px solid var(--rule); background:var(--raise); padding:13px 16px; margin:0 0 16px; border-radius:0 2px 2px 0}
.cal .ct{font:600 10px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; margin-bottom:7px; display:flex; align-items:center; gap:6px}
.cal p:last-child{margin-bottom:0}
.cal-cael{border-left-color:var(--brass); background:var(--brass-soft)} .cal-cael .ct{color:var(--brass)}
:root.table-mode .cal-cael{display:none}
.tmnote{
  display:none; font:400 12px/1.4 var(--sans); color:var(--faint);
  border:1px dashed var(--rule); border-radius:2px; padding:8px 11px; margin:0 0 16px;
}
:root.table-mode .tmnote{display:block}
.cal-cael .md-in{font-style:italic}
.cal-question{border-left-color:var(--river); background:var(--river-soft)} .cal-question .ct{color:var(--river)}
.cal-danger{border-left-color:var(--oxblood); background:var(--oxblood-soft)} .cal-danger .ct{color:var(--oxblood)}

.related{margin-top:34px; padding-top:18px; border-top:1px solid var(--rule)}
.related h4{font:600 10px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin:0 0 11px}
.rellist{display:flex; gap:6px; flex-wrap:wrap}
.rellist button{
  font:400 12.5px var(--sans); background:var(--raise); border:1px solid var(--rule);
  color:var(--river); padding:5px 10px; border-radius:2px; cursor:pointer;
}
.rellist button:hover{border-color:var(--river); background:var(--river-soft)}

.placeholder{color:var(--faint); max-width:52ch; padding-top:8px}
.placeholder h2{font-family:var(--serif); font-weight:400; font-size:30px; color:var(--ink); margin:0 0 12px}
.placeholder kbd{
  font:500 11px var(--mono); background:var(--raise); border:1px solid var(--rule);
  border-bottom-width:2px; border-radius:3px; padding:2px 6px; color:var(--ink);
}
.placeholder ul{padding-left:18px; margin:14px 0 0} .placeholder li{margin-bottom:7px}

/* ---------- board view ---------- */
.boardview{padding:4px 0 0}
.boardview h2{font-family:var(--serif); font-weight:400; font-size:32px; margin:0 0 6px; line-height:1.1}
.boardview .bsub{color:var(--slate); font-size:14px; margin:0 0 22px; max-width:60ch}
.grp{margin-bottom:26px}
.grp h3{font:600 10.5px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase; color:var(--brass); margin:0 0 10px; padding-bottom:7px; border-bottom:1px solid var(--rule)}

/* ---------------------------------------------------------------------
   Phones get a different shape, not a squeezed desktop:
   - only the search row is sticky, so reading a note uses the whole screen
   - filters and boards live in a sheet you open, not strips you must swipe
   - tapping a result opens the note full screen with its own back bar
   --------------------------------------------------------------------- */
@media (max-width:700px){
  .bar{position:static; padding:12px 14px 0}
  .bar-top{gap:10px; margin-bottom:11px}
  .tagline{display:none}
  .wordmark{font-size:21px}

  .searchrow{
    position:sticky; top:0; z-index:60; margin:0 -14px 0; padding:9px 14px;
    background:var(--paper); border-bottom:1px solid var(--rule); gap:8px;
  }
  #q{padding:12px 12px 12px 34px}      /* 16px font stops iOS zoom-on-focus */
  .hits{order:3; flex-basis:100%; text-align:right; font-size:10px; padding-top:2px}

  .filterbtn{
    display:inline-flex; align-items:center; gap:5px; flex:0 0 auto; min-height:46px; padding:0 13px;
    font:600 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    background:var(--raise); border:1px solid var(--rule); color:var(--slate);
    border-radius:2px; cursor:pointer;
  }
  .filterbtn[aria-expanded="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}
  #fcount:not(:empty){
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    padding:0 4px; border-radius:9px; background:var(--brass); color:#fff; font-size:9.5px;
  }

  /* the sheet */
  #controls{display:none; padding-bottom:4px}
  :root.filters-open #controls{display:block}
  .chips,.facets,.boards{flex-wrap:wrap; padding-bottom:10px}
  .chip,.board{min-height:44px; display:inline-flex; align-items:center; padding:0 13px}
  .themebtn{min-height:44px; display:inline-flex; align-items:center; padding:0 12px}
  .facetlabel{line-height:44px}

  /* list */
  .work{grid-template-columns:1fr}
  .index{border-right:none; max-height:none; min-height:0}
  .row{min-height:60px}
  .rbody{padding:13px 14px}
  .rname{font-size:20px}

  /* note, full screen */
  :root.viewing .bar{display:none}
  :root.viewing .index{display:none}
  .detail{max-height:none; padding:0 0 70px}
  .detailbar{
    display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:70;
    background:var(--paper); border-bottom:1px solid var(--rule); padding:8px 12px; margin-bottom:18px;
  }
  .detailbar .bk{
    flex:0 0 auto; min-height:44px; min-width:44px; display:inline-flex; align-items:center;
    justify-content:center; background:none; border:1px solid var(--rule); border-radius:2px;
    color:var(--slate); cursor:pointer; font-size:17px;
  }
  .detailbar .bt{
    font-family:var(--serif); font-size:18px; line-height:1.15; min-width:0; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .detailbar .tm{
    flex:0 0 auto; min-height:44px; padding:0 11px; display:inline-flex; align-items:center;
    font:600 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    background:none; border:1px solid var(--rule); border-radius:2px; color:var(--slate); cursor:pointer;
  }
  :root.table-mode .detailbar .tm{background:var(--brass); border-color:var(--brass); color:#fff}
  .dhead,.md,.related,.tmnote,.boardview,.placeholder{padding-left:16px; padding-right:16px}
  h1.dname{font-size:31px}
  .md{font-size:16px}
  .rellist button{min-height:40px}
}
@media (min-width:701px){ .detailbar{display:none} }

@media (max-width:880px) and (min-width:701px){
  .work{grid-template-columns:1fr}
  .index{max-height:none; min-height:0; border-right:none; border-bottom:1px solid var(--rule)}
  .index.hide-m{display:none}
  .detail{max-height:none; padding:22px 20px 60px}
  h1.dname{font-size:33px}
}
</style>

<div class="bar">
  <div class="bar-top">
    <div class="wordmark">Yartar <em>Vault</em></div>
    <div class="tagline">104 notes &middot; current through Session 3</div>
    <div class="spacer"></div>
    <button class="themebtn" id="tablemode" type="button" aria-pressed="false">Table mode</button>
    <button class="themebtn" id="theme" type="button">Theme</button>
  </div>
  <div class="searchrow">
    <div class="searchwrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search everything&hellip;">
    </div>
    <button class="filterbtn" id="filterbtn" type="button" aria-expanded="false">Filters<span id="fcount"></span></button>
    <span class="hits" id="hits"></span>
  </div>
  <div id="controls">
    <div class="chips" id="kinds"></div>
    <div class="facets" id="facets"></div>
    <div class="boards" id="boards"></div>
  </div>
</div>

<div class="work">
  <div class="index" id="index"></div>
  <div class="detail" id="detail"></div>
</div>

<script>
const DATA = [{"name":"Dashboard","kind":"dashboard","tags":[],"props":{"updated":"session-3"},"body":"*Reading aloud at the table? Use [[Previously On]].*\n\n## Where we are\n\nInside the [[Vanishing Tower]], having stepped through a rift in [[The Professor]]'s tower east of the [[Evermoors]]. Objective: close the rift and bring back as many [[Memory Shards]] as we can carry.\n\nOutside, the tower is ringed by fifty to sixty [[The Orc Horde|orcs]] camped in [[Netheril|Netherese ruins]]. We got in unseen. We have no plan for getting out.\n\n## The clock\n\n> [!danger] [[The Poison|The poison]]\n> Administered at [[The Last Pint]] before [[Session 2 - Marked by the Unseen|Session 2]]. [[The Knife]]'s antidotes bought partial relief. [[Cael]] has calmed the symptoms; **he has not stopped the progression.** [[The Professor]] is brewing the real antidote while we run his errand. He is not stable, and he is not being watched.\n\n## Active\n\n| Thread | Status |\n|---|---|\n| Close the rift, gather [[Memory Shards]] | in progress |\n| Collect the antidote from [[The Professor]] | pending our return |\n| Return [[Silvio]]'s amulet to Silverymoon | open since Session 0.5 |\n| Find out what became of [[Devon Dale]] | unresolved |\n| Get past the [[The Orc Horde|horde]] on the way out | unplanned |\n\nFull board: [[Open Threads]]\n\n## Owed\n\n- [[Dell]]'s caravan — allies on sight, freely promised\n- [[Vetel Kraye]] — wants to meet again, far side of the [[Ironspike Bridge]] in [[Yartar]]\n- [[Rennik Dale]] — the job was to save his daughter. We do not know if we did.\n\nFull ledger: [[Promises & Debts]]\n\n## Hunting us\n\n- [[The Kraken Society]] — promised we would regret it, by name\n- [[The Unseen]] — [[Reon Sahtar]] was waiting at [[The Last Pint]] with a bigger force\n- [[The Ravensworth]] — not hostile to us, but they have our measure and we handed them a direction\n\n> [!cael] Cael\n> Three of those we could have avoided. Two of them we walked into on purpose. He has stopped pretending that is an accident.","links":["Previously On","Vanishing Tower","The Professor","Evermoors","Memory Shards","The Orc Horde","Netheril","The Poison","The Last Pint","Session 2 - Marked by the Unseen","The Knife","Cael","Silvio","Devon Dale","Open Threads","Dell","Vetel Kraye","Ironspike Bridge","Yartar","Rennik Dale","Promises & Debts","The Kraken Society","The Unseen","Reon Sahtar","The Ravensworth"]},{"name":"Epic Moments","kind":"dashboard","tags":["moments"],"props":{},"body":"The beats worth remembering out loud. Keep this short and keep it earned.\n\n---\n\n### The cavern under the corpses\n`Session 0.5` · [[Noannar's Hold]]\n[[Cael]] and [[Simon]] lived because a small hollow opened under a mountain of the dead. Nothing they did earned it.\n> [!cael] Cael\n> Luck, he says, is the moment before a thing has settled. He has never been closer to the moment, and he has never been less sure who settled it.\n\n### The child in the paladin's arms\n`Session 0.5`\n[[Brian]] died in [[James D Folly]]'s hands after the water came down into the caves. The paladin has not been the same.\n\n### Devon's performance\n`Session 1` · [[The Hearthstone]], [[Duskandale]]\n[[Devon Dale]] refused to run and told the room the truth instead — the [[The Ashrit Circle|Circle]], the [[The Hand of Yartar|Hand]], all of it. A magnificent piece of storytelling.\n> [!cael] Cael\n> He judged it honest, and decided on the spot she was worth saving. That judgment is his one real vanity. It has been wrong before, expensively, and he chose to trust it anyway. **Character beat — flag for the DM.**\n\n### Wearing her face out the door\n`Session 1`\n[[Cael]] took [[Devon Dale]]'s place and sent her running invisible, steering her eyes away from [[Tak]]'s body on the way out. The village never knew. Only [[The Knife]] saw through it — because [[Vaelis]] told him.\n\n### Ten off the road\n`Session 3` · east of [[The Drawbridge]]\nMedicine, prayer and magic, spent to the last drop, and nearly ten people who were going to die did not. [[Torvin]]'s daughter among them.\n> [!cael] Cael\n> To an uprooted village on a bad road, he is now a story with a name in it. He notices that he did not hate this.","links":["Noannar's Hold","Cael","Simon","Brian","James D Folly","The Hearthstone","Duskandale","Devon Dale","The Ashrit Circle","The Hand of Yartar","Tak","The Knife","Vaelis","The Drawbridge","Torvin"]},{"name":"Open Threads","kind":"dashboard","tags":["threads"],"props":{},"body":"Sorted by how much they are likely to hurt. Each has its own note in `09 Threads` with what we know, what we don't, and who would know — this page is the running order. Live tables: [[Views]].\n\n## Hot\n\n### [[Curing the poison]]\n`#status/active` · [[Session 2 - Marked by the Unseen|S2]]\nDosed at [[The Last Pint]]. Partial antidotes from [[The Knife]]. [[Cael]] is holding the symptoms down and the progression is continuing underneath. [[The Professor]] has the cure and our leash.\n> [!question] What exactly are we poisoned with? Nobody has named it. [[Elis]] in the [[The Warrens|Warrens]] was floated as a backup and never pursued.\n\n### [[Getting out past the horde]]\n`#status/active` · [[Session 3 - Trail of Hope|S3]]\nFifty to sixty [[The Orc Horde|orcs]], a towering female warleader, camped in [[Netheril|Netherese ruins]]. We went in invisible. Invisibility is a resource, not a plan.\n\n### [[Where Devon went]]\n`#status/active` · [[Session 2 - Marked by the Unseen|S2]]\n[[Vetel Kraye]] was her extraction — a griffon out. He says **she never arrived.** [[The Knife]] and [[The Songbird]] left to hunt her with a direction we gave them.\n> [!cael] Cael\n> He took her place so she could run. If she died anyway, the trade bought nothing. He would like to know which it was, and he is not sure he wants to know.\n\n## Warm\n\n### [[Tak is alive]]\n`#status/active` · [[Session 1 - The Savage Daughter|S1]], [[Session 3 - Trail of Hope|S3]]\n[[Cael]] steered [[Devon Dale]] away from a body hanging outside the window in [[Duskandale]] — [[Tak]]'s. In S3, on the road back for the horses, Cael saw Tak alive and talking to a gathered group.\n> [!question] Was the body someone else? Was it never a body? Was Tak turned, or was he theirs from the start? Who was he talking to?\n\n### [[The Circle and the Hand]]\n`#status/active` · [[Session 1 - The Savage Daughter|S1]]\n[[Devon Dale]] had documents proving [[The Ashrit Circle]] — fake resistance against [[Caldren Voss]] — is in league with [[The Hand of Yartar]]. **Her allies took the files and left.** We never read them and we do not have them.\n\n### [[Cael's shift in time]]\n`#status/active` · [[Session 3 - Trail of Hope|S3]]\nWhile working the ropes of [[The Drawbridge]] inside [[Lorien]]'s chronurgy, [[Cael]] experienced a strange displacement in time. Unexplained. Nobody has followed it up.\n> [!cael] Cael\n> He has not mentioned it to Lorien. He is telling himself it was the magic.\n\n### [[The Professor's stability]]\n`#status/active` · [[Session 3 - Trail of Hope|S3]]\nHe is trying to close rifts between the material realm and the [[Vanishing Tower]]. He also keeps sending people *into* it to prove a theory. He was [[Lorien]]'s mentor. He is holding our antidote.\n\n## Cold\n\n### [[The Kraken's promise]]\n`#status/cold` · [[Session 0.5 - Noannar's Hold Massacre|S0.5]]\nA sahuagin caster used the gem to raise the pillar that drowned [[Noannar's Hold]]. [[The KrakenWizard]] named his people before he died and promised consequences. Nothing since.\n\n### [[Silvio's errand]]\n`#status/cold` · [[Session 0.5 - Noannar's Hold Massacre|S0.5]]\nA wife and three children in Silverymoon. See [[Promises & Debts]].\n\n### [[Whose name is Ravensworth]]\n`#status/cold` · [[Session 3 - Trail of Hope|S3]]\nWe learned they are **[[Doman Vein]]** and **[[Iskra Vein]]**. So *Ravensworth* is a title, an epithet, or a company — not a family name.\n> [!question] Whose name is Ravensworth, then?\n\n### [[The burned Waterbaron]]\n`#status/cold` · [[Session 1 - The Savage Daughter|S1]]\n[[Caldren Voss]] took [[Yartar]] by coup and burned his predecessor. Her handprint is still on the side of the bridge. Nobody has told us her name.\n\n### [[Duskandale is too perfect]]\n`#status/cold` · [[Session 1 - The Savage Daughter|S1]]\nBuilt by [[Corvan Vallen]] of [[House Vallen]]. Named in Common **and Elvish**, which was noted as odd. Rich, peaceful, uniformly happy. [[Dell]]'s refugees were sent there.\n\n### [[The Elis lead]]\n`#status/cold` · [[Session 2 - Marked by the Unseen|S2]]\nNamed by [[Tom Farow]] as a possible antidote source in the [[The Warrens|Warrens]]. Never pursued. Still a name we hold and nobody knows we hold.","links":["Views","Curing the poison","Session 2 - Marked by the Unseen","The Last Pint","The Knife","Cael","The Professor","Elis","The Warrens","Getting out past the horde","Session 3 - Trail of Hope","The Orc Horde","Netheril","Where Devon went","Vetel Kraye","The Songbird","Tak is alive","Session 1 - The Savage Daughter","Devon Dale","Duskandale","Tak","The Circle and the Hand","The Ashrit Circle","Caldren Voss","The Hand of Yartar","Cael's shift in time","The Drawbridge","Lorien","The Professor's stability","Vanishing Tower","The Kraken's promise","Session 0.5 - Noannar's Hold Massacre","Noannar's Hold","The KrakenWizard","Silvio's errand","Promises & Debts","Whose name is Ravensworth","The burned Waterbaron","Yartar","Duskandale is too perfect","Corvan Vallen","House Vallen","Dell","The Elis lead","Tom Farow"]},{"name":"Previously On","kind":"dashboard","tags":["recap"],"props":{"updated":"session-3"},"body":"*Read aloud at the start of play. Regenerated after every session by `/recap`.*\n\n---\n\nThree of you are dying, slowly, and none of you know what from.\n\nThe poison went in at **the Last Pint**, the morning after you played that room as **the Harpies Lyras**. **The Knife** sold you a half-cure for the direction **Devon Dale** ran — the woman you were hired to save, the woman **Cael** wore out of Duskandale so she could run invisible under her own face. She never reached her extraction. Nobody knows where she is, and the people who took her documents are gone too.\n\nThe only real antidote is east. East is a drawbridge that hasn't moved in an age. East is ten people **Cael** pulled off a road the orcs had already finished with, who will tell that story for the rest of their lives. And east, finally, is a tower ringed by sixty of them, camped in ruins older than the kingdom that named them.\n\nYou went in invisible. **The Professor** — Lorien's old teacher, and not a steady man — is brewing your cure right now, alone, while you are somewhere else entirely.\n\nBecause the price was an errand. Through the rift, into the **Vanishing Tower** of Ilvaeris, god of time and memory and history.\n\nThere are columns here made of memory. There are things living in them that feed on it.\n\nYou have a rift to close, shards to carry home, and no way out but the one you came in by.","links":[]},{"name":"Promises & Debts","kind":"dashboard","tags":["promises"],"props":{},"body":"## We owe\n\n**[[Silvio]]'s amulet → his wife and three children, Silverymoon.**\nGiven by a dying gnome under a pile of corpses at [[Noannar's Hold]]. He used his last breath on it. `#status/open` · Session 0.5\n\n**[[Brisk]] will follow.**\n[[Cael]] promised [[Devon Dale]] that her friend would come after her, to get her moving. Brisk left with her allies and the files instead. `#status/broken?` · Session 1\n> [!cael] Cael\n> He said it to save her life and he would say it again. It was still a lie, and he has not decided what he owes for it.\n\n**[[The Professor]]'s errand.**\nClose the rift, bring back [[Memory Shards]]. Payment is the antidote. `#status/open` · Session 3\n\n**[[Rennik Dale]]'s job.**\nEscort his daughter to safety. Unclear whether completed, failed, or neither. `#status/unresolved` · Session 1\n\n## We are owed\n\n**[[Dell]] and the Evermoor caravan** — steadfast allies if we meet again. Freely given, unprompted, after [[Cael]] pulled ten of them back from certain death. They were pointed at [[Duskandale]]. `#status/open` · Session 3\n\n**[[Vetel Kraye]]** — sheltered us, fought beside us, fed us. Asked only to meet again, far side of the [[Ironspike Bridge]] in [[Yartar]], if fate allows. `#status/open` · Session 2\n\n**[[Torvin]]** — already paid in full. See [[Torvin's Shield]].\n\n**[[Beat]]** — broke his master's standing instruction to fetch us antitoxins. He is a construct and may not think of it as a debt. We should. `#status/open` · Session 3\n\n## Held against us\n\n**[[The Kraken Society]]** — a named promise of regret, from a dying wizard. `#status/open`\n\n**[[The Unseen]]** — we killed a war party and took their gear. [[Reon Sahtar]] knows. `#status/open`","links":["Silvio","Noannar's Hold","Brisk","Cael","Devon Dale","The Professor","Memory Shards","Rennik Dale","Dell","Duskandale","Vetel Kraye","Ironspike Bridge","Yartar","Torvin","Torvin's Shield","Beat","The Kraken Society","The Unseen","Reon Sahtar"]},{"name":"Timeline","kind":"dashboard","tags":["timeline"],"props":{},"body":"| When | What | Where |\n|---|---|---|\n| Before it starts | [[Cael]] is given the [[Coin of Tymora]] by an old mentor | the river |\n| **S0.5** | [[Cael]] rides as bodyguard to an elf clerk; caravan halts | [[Noannar's Hold]] |\n| **S0.5** | [[Sol]]'s rumour sends him to the temple of Eldath | [[Noannar's Hold]] |\n| **S0.5** | Doors barricaded; a pillar of seawater; sahuagin; massacre | the temple |\n| **S0.5** | [[Cael]] and [[Simon]] survive beneath the dead; [[Silvio]] dies | the tunnels |\n| **S0.5** | Meet [[Vaelis]], [[James D Folly]], [[Wong Bless]], [[Brian]] | the caves |\n| **S0.5** | The [[Blue Gem]] fight; [[The KrakenWizard]] falls naming his masters | the caves |\n| **S0.5** | The Hold drowns. [[Brian]] dies. The party splits. | — |\n| *~2 weeks* | Notoriety, and its fading | [[Yartar]] |\n| **S1** | Summons from [[Rennik Dale]]; meet [[Lorien]] | [[7 Sinners]] |\n| **S1** | Fake tolls on the road; detour | Evermoor Way |\n| **S1** | [[Devon Dale]] found; she refuses to run; she performs | [[The Hearthstone]] |\n| **S1** | She is marked — a pin and a raven's feather. [[Tak]] hangs. | [[Duskandale]] |\n| **S1** | [[Cael]] takes her face; she runs. [[The Knife]] is waiting. | outside the village |\n| **S2** | The parley: antidotes for a direction | the road |\n| **S2** | [[Vaelis]] reveals the disguise | — |\n| **S2** | Ambush by [[The Unseen]]; [[Vetel Kraye]] intervenes; [[Selda]] dies | — |\n| **S2** | [[Tom Farow]] talks: [[Reon Sahtar]], [[Elis]], the rings and bandages | — |\n| **S2** | Shelter, breakfast, and Vetel's news: Devon never arrived | the small cave |\n| **S3** | Back toward the village for horses. [[Tak]] seen **alive**. | the road |\n| **S3** | [[The Drawbridge]] restored; [[Cael]]'s shift in time | south of the [[Evermoors]] |\n| **S3** | The orc-struck caravan; ten saved; [[Torvin's Shield]] given | beyond the bridge |\n| **S3** | The horde, the ruins, the tower; [[Beat]] at the door | [[The Professor's Tower]] |\n| **S3** | Terms with [[The Professor]]; through the rift | [[Vanishing Tower]] |","links":["Cael","Coin of Tymora","Noannar's Hold","Sol","Simon","Silvio","Vaelis","James D Folly","Wong Bless","Brian","Blue Gem","The KrakenWizard","Yartar","Rennik Dale","Lorien","7 Sinners","Devon Dale","The Hearthstone","Tak","Duskandale","The Knife","The Unseen","Vetel Kraye","Selda","Tom Farow","Reon Sahtar","Elis","The Drawbridge","Evermoors","Torvin's Shield","Beat","The Professor's Tower","The Professor","Vanishing Tower"]},{"name":"Views","kind":"dashboard","tags":[],"props":{},"body":"Live tables built off the frontmatter defined in [[Property Schema]]. These list things. The [[Dashboard]] says what matters — keep both.\n\n> [!danger] Open this folder as its own Obsidian vault\n> There are **eight** nested `.obsidian` roots under `DnD`, and three other copies of this campaign sitting beside this one — `Long Campaigns/Yartar`, `Long Campaigns/Yartar - Copy`, and `Long Campaigns/Ledger/Grey Ledger Vault`. If Obsidian is opened at any folder above this one, every view double-counts: two Ravensworths, a stray *Voss Regime*, somebody else's `T - Faction` template.\n>\n> **Fix:** Obsidian → *Open folder as vault* → point it at `Long Campaigns/Vault`. It already has its own `.obsidian`. This also switches on the `cael-callout` CSS snippet, which lives in this folder and is inactive under any other root.\n\n## The bases\n\nObsidian's **Bases** is a core feature, so these work on a clean install.\n\n| Base | Views |\n|---|---|\n| `Threads.base` | *By heat* · *Hot* · *Quests* · *Threats* · *Mysteries* · *Closed* |\n| `NPCs.base` | *Who matters* · *Allies* · *Pointed at us* · *Loose ends* · *Cael's cover* · *The dead* |\n| `Locations.base` | *Everywhere* · *Do not walk in* · *Yartar* · *Gone or barred* |\n| `Factions.base` | *All factions* · *Dangerous* · *Hostile to us* |\n| `Items.base` | *Everything we hold* · *Unidentified* · *Not in our hands* |\n| `Lore.base` | *What we believe* · *On one person's word* |\n\n## The queries that matter\n\n**What is going to hurt.** `Threads.base` → *Hot*. Three of them: [[Curing the poison]], [[Getting out past the horde]], [[Where Devon went]].\n\n**Who is unaccounted for.** `status` in `unknown`, `missing`, `presumed-dead`. [[Devon Dale]] — the job — plus [[Brisk]], [[Sef]] and [[Fren]] with the files they walked off with, and [[Tom Farow]], who talked and vanished.\n\n**What we are carrying that we do not understand.** `identified: false`. The [[Coin of Tymora]] has been in [[Cael]]'s pocket since before the campaign started. [[Selda's Signet Ring]] is the strongest unexamined lead the party owns.\n\n**Where it is dangerous and why.** `danger` is separate from `status` on purpose. [[The Last Pint]] is an intact, open, working pub — the danger is that [[Reon Sahtar]] is sitting in it.\n\n**What we believe because one man said so.** `confidence` and `source`. [[Ilvaeris]] and [[Time as Memory]] both trace to [[The Professor]], who is not neutral, is not stable, and is brewing the antidote.\n\n## Dataview fallback\n\nIf you install the **Dataview** plugin, the same views work as queries in any note:\n\n```dataview\nTABLE heat, type, opened\nFROM #thread\nWHERE status = \"active\"\nSORT heat ASC\n```\n\n```dataview\nTABLE tier, status, disposition, faction, last_seen\nFROM #npc\nWHERE tier != \"background\"\nSORT tier ASC, file.name ASC\n```\n\n```dataview\nTABLE type, parent, status, danger, access\nFROM #location\nWHERE danger = \"risky\" OR danger = \"deadly\"\n```\n\n```dataview\nTABLE type, holder, identified, origin\nFROM #item\nWHERE identified = false\n```\n\n```dataview\nTABLE confidence, source\nFROM #lore\nWHERE confidence != \"established\"\n```","links":["Dashboard","Curing the poison","Getting out past the horde","Where Devon went","Devon Dale","Brisk","Sef","Fren","Tom Farow","Coin of Tymora","Cael","Selda's Signet Ring","The Last Pint","Reon Sahtar","Ilvaeris","Time as Memory","The Professor"]},{"name":"Session 0.5 - Noannar's Hold Massacre","kind":"session","tags":[],"props":{"session":0.5,"title":"Noannar's Hold Massacre","pcs":["[[Cael]]","[[Vaelis]]","[[Simon]]","[[James D Folly]]","[[Wong Bless]]"],"locations":["[[Noannar's Hold]]"],"npcs":["[[Sol]]","[[Silvio]]","[[Brian]]","[[The KrakenWizard]]"]},"body":"## Before\n\n[[Cael]] was given the [[Coin of Tymora]] by an old mentor from his road years — holed through the middle, and smooth on the tails side where something used to be. It is magical. What it does is not established.\n\n## The Hold\n\nCael was travelling as bodyguard to an elf clerk, part of a caravan that stopped at [[Noannar's Hold]].\n\nHe heard from [[Sol]] — an old sailor missing an eye, a leg and an arm, all on his right side — that the temple of Eldath in the Hold stood on something older. He went to look. He found that the site had belonged to **Leira** in ages past, and that a town's worth of people now prayed to Eldath on top of her.\n\n> [!cael] Cael\n> He found this funnier than he let on, and said nothing to anyone.\n\n## The massacre\n\nA gathering was called at the temple. It was an ambush.\n\nThe doors were barricaded from outside. A pillar of seawater rose inside the temple out of nothing, and sahuagin came out of it. What followed was not a fight. Almost nobody got out.\n\n[[Cael]] and [[Simon]] lived by falling into a small hollow beneath the piled dead. [[Silvio]], a gnome, survived long enough to press his amulet on them and ask that it reach his wife and three children in **Silverymoon**. He died in their hands.\n\n## The tunnels\n\nAfter a long rest they followed the hollow down into a cave system, and found others already in it: [[Vaelis]], [[James D Folly]], [[Wong Bless]], and a child, [[Brian]], attached to James.\n\nThat group had been sent to retrieve a **[[Blue Gem]]** from the temple. Together they came back up through the aftermath.\n\n## The gem\n\nA hard fight with sahuagin. One was a caster, and it was he who had used the [[Blue Gem]] to raise the pillar that destroyed the Hold. There was also a wizard, whom [[Vaelis]] destroyed — [[The KrakenWizard]], who gave his name and, dying, promised that the party would regret interfering with **[[The Kraken Society]]**.\n\nThe water kept coming. [[Noannar's Hold]] went under.\n\n[[Brian]] died in [[James D Folly]]'s arms in the aftermath, when the water came down into the caves. It broke something in the paladin.\n\n## After\n\nThe party split. [[Cael]] stayed with [[Vaelis]] and they talked about where they had come from.\n\nCael learned that Vaelis gathers the last breath of those he kills, and that this eases their passing — that he sees, briefly, how the dying perceive the world at the end. Cael found this fascinating rather than grim. He also came away certain that Vaelis is close to death himself, and detached in a way that is not ordinary.\n\nThey work well together regardless.\n\n> [!cael] Cael\n> A whole town praying at the wrong altar and never once the worse for it. A dying man's perception, borrowed by his killer. Cael did not survive that temple with a lesson about violence. He came out of it more convinced than ever that what people believe is doing load-bearing work in the world.","links":["Cael","Coin of Tymora","Noannar's Hold","Sol","Simon","Silvio","Vaelis","James D Folly","Wong Bless","Brian","Blue Gem","The KrakenWizard","The Kraken Society"]},{"name":"Session 1 - The Savage Daughter","kind":"session","tags":[],"props":{"session":1,"title":"The Savage Daughter","pcs":["[[Cael]]","[[Vaelis]]","[[Lorien]]"],"locations":["[[Yartar]]","[[7 Sinners]]","[[Duskandale]]","[[The Hearthstone]]"],"npcs":["[[Rennik Dale]]","[[Devon Dale]]","[[Brek]]","[[Tak]]","[[Sef]]","[[Fren]]","[[Brisk]]","[[The Knife]]","[[The Songbird]]"]},"body":"## Yartar, briefly\n\nGroundwork laid this session — full note at [[Yartar]].\n\n[[Caldren Voss]] holds the city, taken by coup. He executed and burned his predecessor; **her handprint is still visible on the side of the bridge.** He styles himself a baron of the people, for the people. Many disagree.\n\n[[The Hand of Yartar]] is gaining ground: daggers, poison, information. Membership is women only. They hire male goons.\n\nDistricts: [[Merchant Quarter]], [[Waterfront]], [[The Warrens]], [[High Ward]], [[Temple District]].\n\n## The job\n\nA couple of weeks after [[Noannar's Hold]], with the party's notoriety fading, a summons came from **[[Rennik Dale]]** — \"the Gatekeeper,\" a general merchant and the best fixer on the [[Waterfront]]. His good grace is a ticket upward.\n\nThey met in a back room at [[7 Sinners]], a street gambling den, and there met **[[Lorien]]** — human, twenty-four or so, a chronurgy wizard, dressed up for a business meeting and reluctant to say much.\n\nThe job: escort a person to safety. There is a bounty on her. It came out on the road that she is **[[Devon Dale]]**, Rennik's daughter, currently in [[Duskandale]].\n\nShe stole from **[[The Ashrit Circle]]** *(name unconfirmed)* — who present as a resistance movement against [[Caldren Voss]] but are in fact collecting money and support for other purposes. The bounty was picked up by **[[The Ravensworth]]**: two human siblings, legends among assassins, well above the party's weight, who are said never to miss. [[The Songbird]] and [[The Knife]].\n\n## The road\n\nMen posing as [[Caldren Voss|Waterbaron]] toll guards, demanding absurd sums. The party detoured around them. It does the Baron's name no good, and [[Lorien]] seemed pleased about that.\n\n## Duskandale\n\nA gem of a village, built by **[[Corvan Vallen]]** of [[House Vallen]]. Its name exists in Common and in Elvish, which struck the party as odd. Rich, peaceful, idyllic — a picture of a place.\n\nA dwarf family welcomed them. They met [[Brek]], who keeps watch by lounging in an old windmill. In the evening the whole village gathered at [[The Hearthstone]] on the square.\n\nThere they found [[Devon Dale]] with her allies: [[Tak]], [[Sef]], [[Fren]], and [[Brisk]].\n\n## She will not run\n\nShe would not be moved, and did not believe the siblings were coming. She produced **documents proving [[The Ashrit Circle]] and [[The Hand of Yartar]] are working together**, and said she was going out to tell the people. [[Vaelis]] made a genuinely moving speech and it did not work.\n\nThen she performed — and it was magnificent.\n\n> [!cael] Cael\n> Hunted, honest, and beautifully told. He decided she was worth saving on the strength of the telling. That is exactly how he decides things, and it is exactly the thing about him that has gone wrong before.\n\n## The mark\n\nWhile she was outside, the siblings marked her: **a pin and a raven's feather.** She understood then that it was real.\n\n[[Cael]] told her to shift her perception — the city, not the group; survival, not the cause. She broke, and accepted his plan: he would take her place while she ran invisible. She asked that [[Brisk]] come with her. Cael promised Brisk would follow.\n\nOn the way out he steered her eyes away from the window, and from [[Tak]]'s body hanging outside it.\n\n## The run\n\nEven running, she hesitated — ready to throw it all away and go back for [[Brisk]]. They got her clear and moving toward her destination.\n\nThen [[Lorien]], [[Vaelis]] and Cael — still wearing her face — saw **[[The Knife]]** waiting for them.","links":["Yartar","Caldren Voss","The Hand of Yartar","Merchant Quarter","Waterfront","The Warrens","High Ward","Temple District","Noannar's Hold","Rennik Dale","7 Sinners","Lorien","Devon Dale","Duskandale","The Ashrit Circle","The Ravensworth","The Songbird","The Knife","Corvan Vallen","House Vallen","Brek","The Hearthstone","Tak","Sef","Fren","Brisk","Vaelis","Cael"]},{"name":"Session 2 - Marked by the Unseen","kind":"session","tags":[],"props":{"session":2,"title":"Marked by the Unseen","pcs":["[[Cael]]","[[Vaelis]]","[[Lorien]]"],"locations":["[[The Last Pint]]"],"npcs":["[[The Knife]]","[[The Songbird]]","[[Selda]]","[[Tom Farow]]","[[Vetel Kraye]]"]},"body":"## The parley\n\n[[The Knife]] had them, and talked anyway. He knew things about the party. He said he does not kill without reason. He wanted only [[Devon Dale]].\n\nAnd he had leverage: **antidotes.** The party had been poisoned that morning at [[The Last Pint]], where they had stayed the night before, given a well-received musical performance, and floated a business proposal as **[[The Harpies Lyras]]**.\n\n[[Cael]], still wearing Devon's face, went forward to trade her for the cure.\n\n**[[Vaelis]] revealed the disguise.**\n\nThe Knife handed over some antidotes in exchange for the direction she had gone, and he and [[The Songbird]] left to hunt her. Devon's allies took her files and left.\n\n> [!cael] Cael\n> The Knife now knows Cael works illusions. That is all he knows — a road-priest with a trick, which is what Cael has always claimed to be. It costs him nothing and he intends to keep it that way.\n\n## The ambush\n\n[[The Unseen]] hit them — a faction rooted in [[The Warrens]] of [[Yartar]], talked about the way people talk about the boogeyman.\n\nIt turned when **[[Vetel Kraye]]** arrived: a strange man, or not quite a man, carrying some private suffering and a real hatred of the Unseen. He helped them win.\n\nThe Unseen's caster, **[[Selda]]**, a high elf woman, was killed.\n\n## Tom Farow\n\nThe one survivor. He gave them:\n\n- Another ambush waits at [[The Last Pint]], under **[[Reon Sahtar]]** — a top man of the Unseen — with a larger force.\n- **[[Elis]]**, a potion mistress in [[The Warrens]], as a possible antidote source. No guarantee.\n- **How to pass as Unseen:** their rings, and the bandages they wrap themselves in. Wear both and you read as a member.\n\n## Loot\n\nSee [[Party Loot Ledger]]. From the field: 3 heavy crossbows with bolts, 3 hand axes, 3 short swords, 36 gp, a grappling hook with 50 ft of rope, a sabotage kit. From [[Selda]]: 9 pp, a [[Selda's Signet Ring|signet ring]], a [[Selda's Spellbook|spellbook]], a scroll of *blight*, and a [[Sending Stone]].\n\n## The cave\n\n[[Vetel Kraye]] sheltered them. And he told them why he had been out there: **he was [[Devon Dale]]'s extraction.** A griffon, and a way out.\n\nShe never arrived. He does not know what happened to her, and neither does anyone else.\n\nThe only real answer to the poison, he said, is a mage to the east.\n\n[[Cael]] worked on the party's condition and got the symptoms down. He could not touch the progression.\n\nVetel had his own road to walk. After a shared breakfast he said he would like to meet again if fate allowed — **the far side of the [[Ironspike Bridge]] in [[Yartar]]** — and they parted.","links":["The Knife","Devon Dale","The Last Pint","The Harpies Lyras","Cael","Vaelis","The Songbird","The Unseen","The Warrens","Yartar","Vetel Kraye","Selda","Reon Sahtar","Elis","Party Loot Ledger","Selda's Signet Ring","Selda's Spellbook","Sending Stone","Ironspike Bridge","Lorien","Tom Farow"]},{"name":"Session 3 - Trail of Hope","kind":"session","tags":[],"props":{"session":3,"title":"Trail of Hope","pcs":["[[Cael]]","[[Vaelis]]","[[Lorien]]"],"locations":["[[Duskandale]]","[[Evermoors]]","[[The Drawbridge]]","[[The Professor's Tower]]","[[Vanishing Tower]]"],"npcs":["[[Tak]]","[[Dell]]","[[Torvin]]","[[The Orc Warleader]]","[[Beat]]","[[The Professor]]"]},"body":"## Back for the horses\n\nThe party set out for the tower and the mage east that [[Vetel Kraye]] had named, and went back toward [[Duskandale]] first — it was close, and their horses were there.\n\nThey kept off the road and away from people. They passed a group gathered together, and **[[Cael]] saw [[Tak]] among them, alive, talking to them.**\n\nNobody has an explanation. See [[Open Threads]].\n\nThen east, along the southern edge of the [[Evermoors]].\n\n## The drawbridge\n\n[[The Drawbridge]] — an old, magnificent piece of engineering, long dead. With [[Lorien]]'s magic they brought it back to working order and got it into position.\n\n> [!cael] Cael\n> While he was on the ropes, inside Lorien's magic, time slipped for him. Briefly, and wrongly. He has told nobody.\n\n## Ten off the road\n\nOn the far side: the aftermath of an orc attack on what looked like a caravan and was actually **a whole village of the [[Evermoors]]**, uprooted and moving for better ground.\n\n[[Cael]] spent everything he had — medicine, prayer, magic — and pulled close to ten people back from certain death. To those people he is now a story with his name in it. [[Lorien]] gave them the party's horses and 3 pp.\n\nTheir guide, **[[Dell]]**, promised the caravan would be steadfast allies if they met again. Lorien sent them toward [[Duskandale]], and suggested they might meet there in a few days — if the party survived.\n\n**[[Torvin]]**, a half-elf whose daughter Cael had saved, gave him an old family heirloom: [[Torvin's Shield]].\n\n## The horde\n\nMoving east, hidden at the roadside with the help of Cael and the mists, they came in sight of [[The Professor's Tower]] — surrounded by the same [[The Orc Horde|orc horde]] that had hit the caravan.\n\nFifty to sixty of them, not all fighters. A towering female orc leads them. They are camped in ancient ruins, later learned to be **[[Netheril|Netherese]]**.\n\n## Inside\n\nThe party made contact with the tower and were given assurances of safe passage if they could reach the door. They went in invisible, and the door opened.\n\n**[[Beat]]** met them: a construct in the service of the tower's master wizard, with a worldview entirely his own. They talked him into fetching antitoxins from the wizard's locked laboratory, against the wizard's standing instruction not to be disturbed.\n\nHere they also learned the [[The Ravensworth|Ravensworth]] siblings' names: **[[Doman Vein]]** and **[[Iskra Vein]]**.\n\n## The Professor\n\nThe master of the tower — [[The Professor]] for now — is working to close rifts between the material realm and the **[[Vanishing Tower]]** of **[[Ilvaeris]]**, god of time, memories and history.\n\nHe holds that time is, at bottom, a collection of memories. The trips into the Vanishing Tower are an experiment to prove it. He does not look stable.\n\nHe was [[Lorien]]'s mentor.\n\n## The terms\n\nHe will prepare the antidote. In exchange, the party goes through the rift in his tower into the Vanishing Tower, closes the rift on the far side, and brings back as many [[Memory Shards]] as they can.\n\nThey accepted.\n\n## Through\n\nThe inside is a realm of its own. Columns made of memory. Things living in it that feed on memory. Everything alien, everything dangerous.","links":["Vetel Kraye","Duskandale","Cael","Tak","Open Threads","Evermoors","The Drawbridge","Lorien","Dell","Torvin","Torvin's Shield","The Professor's Tower","The Orc Horde","Netheril","Beat","The Ravensworth","The Professor","Vanishing Tower","Ilvaeris","Memory Shards","Vaelis","The Orc Warleader"]},{"name":"Brian","kind":"npc","tags":["former-party"],"props":{"tier":"minor","status":"dead","disposition":"ally","gender":"male","first_seen":"session-0.5","last_seen":"session-0.5"},"body":"A child, attached to [[James D Folly]].\n\nDied in the paladin's hands in the aftermath at [[Noannar's Hold]], when the pillar collapsed and the water came down into the caves.\n\nSee [[Epic Moments]].","links":["James D Folly","Noannar's Hold","Epic Moments"]},{"name":"Cael","kind":"party","tags":["pc"],"props":{"player_character":true,"status":"alive","species":"half-elf","class":"cleric","subclass":"trickery","based":"[[Yartar]]","first_seen":"session-0.5","last_seen":"session-3"},"body":"Half-elf, mid-thirties. Caravan guard turned wandering hedge-priest of **Tymora**. Travels light, hires on by the run, blesses a crossing and moves along. No surname — road-folk often haven't one, and he's never offered.\n\n## Where he comes from\n\nHis father was **eladrin**: one season in a human woman's life, gone before Cael was old enough to have a face for him. He answers questions about it the way half-elves do — a shrug, and *he wasn't from here.* It's why he reads as fey to anything that looks, and he says so before he's asked. It saves trouble on temple thresholds.\n\nHis mother was human, and she is dead. The hill hamlet is not there any more — not burned, not cursed, just **emptied**, the way small places in the North empty when the young leave and the old die and nobody writes it down. He doesn't name it.\n\n## The road\n\nFourteen or so when he took up with caravans, and he never took up with anything else. **[[Ghesh]]** taught him the guard's trade. Twenty years behind him now, most of it out of [[Yartar]], and it is the part of his life anyone can check, because all of it happened in front of witnesses.\n\n## The night the coin turned\n\nHe tells this one short, which is how people know it's true.\n\nA bad night on a bad road. The caravan came apart in the dark and he walked out of it at dawn — the only one on his side of the wagons who did. When the sun came up, the dark had stopped being a place he could see into, and it never came back.\n\nA half-elf with no night-eyes is a strange thing and he doesn't pretend otherwise. He calls it **the toll**: the Lady took his night and left him the rest of his life. He has never once argued the trade.\n\n## What he preaches, which is not much\n\nNo temple, no rite, nothing asked for a blessing. Luck, as he tells it, isn't fortune — it's the moment before a thing has settled, when it could still go either way. A blessing is just a way of getting a man to believe the moment is his. Belief moves the outcome.\n\n**On his magic:** the misdirections and the doubled shapes get the same explanation — luck is a shell game, and the Lady likes a crowd that isn't sure yet. Nobody has pushed harder than that, because a road-priest doing a trick with light is a man earning his supper.\n\n## Who will speak for him\n\n[[Jandar Muln]] · [[Denla Harrow]] · [[Ghesh]] · [[Perra Volk]] · [[Alard Kettil]]\n\n## Answers he has ready\n\n| Asked | Answered |\n|---|---|\n| Your people? | \"Dead, or fey. Neither's coming to dinner.\" |\n| Which temple? | None. Lay-priest. Never took a house. |\n| Before Yartar? | The road. Moving. |\n| Why no darkvision? | The toll. Told above, told short. |\n| Why do you ping as fey? | Says it first, every time: his father wasn't from here. |\n\n## In play so far\n\n- Survived [[Noannar's Hold]] under the dead; carries [[Silvio]]'s amulet and his errand.\n- Wore [[Devon Dale]]'s face out of [[Duskandale]] so she could run — an illusion, seen through by [[The Knife]] only because [[Vaelis]] said so.\n- Saved close to ten people after the orc attack; holds [[Torvin's Shield]].\n- Carries the [[Coin of Tymora]].\n- Experienced an unexplained **shift in time** on [[The Drawbridge]]. Has told nobody.","links":["Ghesh","Yartar","Jandar Muln","Denla Harrow","Perra Volk","Alard Kettil","Noannar's Hold","Silvio","Devon Dale","Duskandale","The Knife","Vaelis","Torvin's Shield","Coin of Tymora","The Drawbridge"]},{"name":"Cookie","kind":"npc","tags":[],"props":{"tier":"minor","status":"alive","disposition":"ally","species":"owl","bound_to":"[[Lorien]]"},"body":"[[Lorien]]'s familiar, an owl.\n\nWhich session Cookie first appeared in is not established in the notes.","links":["Lorien"]},{"name":"Former Companions","kind":"party","tags":[],"props":{"first_seen":"session-0.5"},"body":"The [[Noannar's Hold]] group, from before the party settled into its current shape. All parted ways after the Hold went under.\n\n### Simon\nWizard. Survived the massacre with [[Cael]] in the hollow beneath the dead. Present when [[Silvio]] died and the errand to Silverymoon was given.\n\n### James D Folly\nVengeance paladin. Had a child, **[[Brian]]**, attached to him. Brian died in his arms when the water came down into the caves. It broke something.\n\n### Wong Bless\nOpen hand monk. Part of the group sent for the [[Blue Gem]].\n\n### Brian\nA child. Died in [[James D Folly]]'s hands, [[Session 0.5 - Noannar's Hold Massacre|Session 0.5]].","links":["Noannar's Hold","Cael","Silvio","Brian","Blue Gem","James D Folly","Session 0.5 - Noannar's Hold Massacre"]},{"name":"James D Folly","kind":"npc","tags":["former-party"],"props":{"tier":"minor","status":"unknown","disposition":"ally","gender":"male","class":"paladin","subclass":"vengeance","first_seen":"session-0.5","last_seen":"session-0.5"},"body":"Vengeance paladin. Guest of the [[Noannar's Hold]] chapter.\n\nA child, **[[Brian]]**, was attached to him. Brian died in his arms when the water came down into the caves, and it broke something in him.\n\nParted ways after the Hold. See [[Former Companions]].","links":["Noannar's Hold","Brian","Former Companions"]},{"name":"Lorien","kind":"party","tags":["pc"],"props":{"player_character":true,"status":"alive","species":"human","class":"wizard","subclass":"chronurgy","familiar":"[[Cookie]]","based":"[[Yartar]]","first_seen":"session-1","last_seen":"session-3"},"body":"Human, apparent age 24. **Chronurgy** wizard.\n\nMet at [[7 Sinners]], dressed up for a business meeting and visibly not used to it. He brought the party the job that became [[Session 1 - The Savage Daughter|Session 1]], and was reluctant to explain any of it.\n\n## Known\n\n- Keeps a familiar, **[[Cookie]]**, an owl.\n- Apprenticed to **[[The Professor]]**, the wizard in the tower east of the [[Evermoors]].\n- Restored [[The Drawbridge]] with his magic.\n- Gave the party's horses and 3 pp to [[Dell]]'s refugees without being asked, and pointed them at [[Duskandale]].\n- Took visible satisfaction in the fake toll-guards damaging [[Caldren Voss]]'s name.\n\n> [!question] What is his stake in [[Devon Dale]]? He carried a job from [[Rennik Dale]] and would not say why it was him carrying it.\n\n> [!cael] Cael\n> Generous with money, careful with words. Cael reads that as a man paying for something he hasn't named yet.","links":["7 Sinners","Session 1 - The Savage Daughter","Cookie","The Professor","Evermoors","The Drawbridge","Dell","Duskandale","Caldren Voss","Devon Dale","Rennik Dale","Yartar"]},{"name":"Martis","kind":"npc","tags":[],"props":{"tier":"minor","status":"alive","disposition":"ally","species":"sphinx of wonder","bound_to":"[[Vaelis]]"},"body":"[[Vaelis]]'s familiar, a **sphinx of wonder**, summoned through **Pact of the Chain**.\n\nWhich session Martis first appeared in is not established in the notes.","links":["Vaelis"]},{"name":"Simon","kind":"npc","tags":["former-party"],"props":{"tier":"minor","status":"unknown","disposition":"ally","gender":"male","class":"wizard","first_seen":"session-0.5","last_seen":"session-0.5"},"body":"Wizard. Guest of the [[Noannar's Hold]] chapter.\n\nSurvived the massacre alongside [[Cael]] in the hollow beneath the dead, and was present when [[Silvio]] died and gave up his amulet and his errand. Parted ways after the Hold went under.\n\nSee [[Former Companions]].","links":["Noannar's Hold","Cael","Silvio","Former Companions"]},{"name":"The Harpies Lyras","kind":"party","tags":[],"props":{"status":"active","first_seen":"session-2"},"body":"A joke name, coined on the night. The party played a set at [[The Last Pint]] before [[Session 2 - Marked by the Unseen|Session 2]], billed themselves as the Harpies Lyras, and it went well enough that a business proposal followed.\n\nIt has not been used since.\n\n*What follows is the group's standing and reputation, which belongs to them whatever they are calling themselves this week.*\n\n## Standing\n\n| With | Standing |\n|---|---|\n| [[Rennik Dale]] | employed; outcome unresolved |\n| [[The Kraken Society]] | named enemies |\n| [[The Unseen]] | blood between them |\n| [[The Ravensworth]] | dealt with honestly; not enemies |\n| [[Dell]]'s caravan | allies, freely offered |\n| [[Vetel Kraye]] | friendly, unfinished |\n| [[The Professor]] | contracted; he holds the cure |\n\n## Reputation\n\n- Survivors of [[Noannar's Hold]] — briefly famous, then not.\n- To roughly ten Evermoor refugees: the people who saved their lives.\n- To [[The Knife]]: a group he has taken the measure of, containing an illusionist.\n\n## Members\n\n[[Cael]] · [[Vaelis]] · [[Lorien]]\nPreviously: [[Simon]], [[James D Folly]], [[Wong Bless]] — see [[Former Companions]]","links":["The Last Pint","Session 2 - Marked by the Unseen","Rennik Dale","The Kraken Society","The Unseen","The Ravensworth","Dell","Vetel Kraye","The Professor","Noannar's Hold","The Knife","Cael","Vaelis","Lorien","Simon","James D Folly","Wong Bless","Former Companions"]},{"name":"Vaelis","kind":"party","tags":["pc"],"props":{"player_character":true,"status":"alive","species":"shadar-kai","class":"warlock","subclass":"hexblade","pact":"chain","familiar":"[[Martis]]","first_seen":"session-0.5","last_seen":"session-3"},"body":"Shadar-kai. Hexblade warlock.\n\nMet in the caves beneath [[Noannar's Hold]], where he was part of the group sent for the [[Blue Gem]]. He is the one who destroyed [[The KrakenWizard]].\n\nPact of the Chain. He keeps a familiar, **[[Martis]]**, a sphinx of wonder.\n\n## What he does\n\nHe gathers the last breath of those he kills. It eases their passing, and it gives him — briefly — their perception of the world at the end of it.\n\n> [!cael] Cael\n> This is the thing about Vaelis that Cael finds genuinely beautiful, and he has said so. A man who collects how the dying saw it. He is not sure Vaelis understands why it moves him.\n\n## What Cael has noticed\n\nHe is close to death. Not ill in an obvious way — close to it, and detached about it, in a manner that is not ordinary.\n\n## In play\n\n- [[Session 1 - The Savage Daughter|S1]] — gave a genuinely moving speech to [[Devon Dale]]. It failed.\n- [[Session 2 - Marked by the Unseen|S2]] — **revealed [[Cael]]'s disguise to [[The Knife]]** during the parley.\n\nThey work well together regardless.","links":["Noannar's Hold","Blue Gem","The KrakenWizard","Martis","Session 1 - The Savage Daughter","Devon Dale","Session 2 - Marked by the Unseen","Cael","The Knife"]},{"name":"Wong Bless","kind":"npc","tags":["former-party"],"props":{"tier":"minor","status":"unknown","disposition":"ally","class":"monk","subclass":"open hand","first_seen":"session-0.5","last_seen":"session-0.5"},"body":"Open hand monk. Guest of the [[Noannar's Hold]] chapter, part of the group sent for the [[Blue Gem]].\n\nParted ways after the Hold. See [[Former Companions]].","links":["Noannar's Hold","Blue Gem","Former Companions"]},{"name":"Alard Kettil","kind":"npc","tags":["cael-circle"],"props":{"tier":"background","status":"alive","disposition":"ally","gender":"male","first_seen":"pre-campaign"},"body":"A wandering lay-priest of **Tymora** who has shared a dozen campfires with [[Cael]] and treats him as a brother of Luck.\n\nThey meet on the road. Never in a chapel.","links":["Cael"]},{"name":"Beat","kind":"npc","tags":[],"props":{"tier":"recurring","status":"alive","disposition":"friendly","species":"construct","gender":"male","based":"[[The Professor's Tower]]","first_seen":"session-3","last_seen":"session-3"},"body":"A construct in the service of [[The Professor]], and the one who opened the tower door.\n\nHe holds a distinctly personal worldview, which the party found both charming and useful — they talked him into fetching antitoxins from the master's **locked laboratory**, against a standing instruction not to disturb him.\n\n> [!question] Beat broke an order for strangers on the strength of an argument. What else can he be argued into, and what does his master do when he finds out?","links":["The Professor","The Professor's Tower"]},{"name":"Brek","kind":"npc","tags":[],"props":{"tier":"minor","status":"alive","disposition":"neutral","gender":"male","based":"[[Duskandale]]","first_seen":"session-1","last_seen":"session-1"},"body":"Keeps watch over [[Duskandale]] — which he does by lounging comfortably in an old windmill.\n\nA dwarf family welcomed the party to the village; Brek is part of that easy, unbothered picture the place presents.","links":["Duskandale"]},{"name":"Brisk","kind":"npc","tags":[],"props":{"tier":"recurring","status":"unknown","disposition":"neutral","gender":"female","based":"[[Duskandale]]","first_seen":"session-1","last_seen":"session-1"},"body":"Female. One of [[Devon Dale]]'s allies in [[Duskandale]].\n\nDevon would not run without her, and nearly threw the escape away going back for her. [[Cael]] promised she would follow. She left instead, with [[Sef]], [[Fren]] and **the files**.\n\nSee [[Promises & Debts]].","links":["Devon Dale","Duskandale","Cael","Sef","Fren","Promises & Debts"]},{"name":"Caldren Voss","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"unknown","gender":"male","based":"[[High Ward]]","first_seen":"session-1"},"body":"Waterbaron of [[Yartar]].\n\nTook the city by coup. He executed his predecessor — a woman, name unknown to the party — and burned her. **Her handprint is still visible on the side of the bridge.**\n\nHe proclaims himself a baron of the people, for the people. Many in the city are unhappy with him and his methods.\n\n## Around him\n\n- Men posing as his toll guards are shaking down travellers on the roads and doing his name no good. Somebody benefits from that. *([[Session 1 - The Savage Daughter|S1]])*\n- [[The Ashrit Circle]] built a fake resistance movement against him and used it to gather money and support for something else entirely.\n\n> [!question] Who was the burned Waterbaron?","links":["Yartar","Session 1 - The Savage Daughter","The Ashrit Circle","High Ward"]},{"name":"Corvan Vallen","kind":"npc","tags":[],"props":{"tier":"minor","status":"unknown","disposition":"unknown","gender":"male","faction":["[[House Vallen]]"],"based":"[[Duskandale]]","first_seen":"session-1"},"body":"Of [[House Vallen]]. Builder and founder of [[Duskandale]].\n\nHe gave the village a name that exists in **both Common and Elvish**, which the party found strange at the time and has not investigated since.","links":["House Vallen","Duskandale"]},{"name":"Dell","kind":"npc","tags":[],"props":{"tier":"recurring","status":"alive","disposition":"ally","gender":"male","faction":["[[The Evermoor Caravan]]"],"based":"[[Duskandale]]","first_seen":"session-3","last_seen":"session-3"},"body":"Guide and leader of the uprooted [[Evermoors]] village that was attacked by [[The Orc Horde]] in [[Session 3 - Trail of Hope|Session 3]].\n\nAfter [[Cael]] pulled close to ten of his people back from death and [[Lorien]] handed over the horses and 3 pp, he promised the caravan would be **steadfast allies** to the party if they ever met again. Freely offered.\n\nLorien pointed them toward [[Duskandale]]. They may be there now.\n\nSee [[The Evermoor Caravan]].","links":["Evermoors","The Orc Horde","Session 3 - Trail of Hope","Cael","Lorien","Duskandale","The Evermoor Caravan"]},{"name":"Denla Harrow","kind":"npc","tags":["cael-circle"],"props":{"tier":"background","status":"alive","disposition":"ally","species":"human","gender":"female","based":"[[Yartar]]","first_seen":"pre-campaign"},"body":"Human crossbow-guard. Has ridden more roads beside [[Cael]] than anyone alive. Drinks with him. Would vouch for him without being asked and be offended she had to be.\n\nThe warmest thing in Cael's life.","links":["Cael","Yartar"]},{"name":"Devon Dale","kind":"npc","tags":[],"props":{"tier":"major","status":"missing","disposition":"neutral","gender":"female","first_seen":"session-1","last_seen":"session-1"},"body":"Daughter of [[Rennik Dale]]. The job.\n\nShe stole from **[[The Ashrit Circle]]** and took documents proving the Circle and **[[The Hand of Yartar]]** are working together. The Circle put a bounty on her; [[The Ravensworth]] picked it up.\n\nFound in [[Duskandale]] with [[Tak]], [[Sef]], [[Fren]] and [[Brisk]]. She refused to run — she did not believe the siblings were real — and instead told the whole story to the room at [[The Hearthstone]]. It was a superb piece of storytelling.\n\nMarked outside that night: **a pin and a raven's feather.** After that she believed it.\n\n[[Cael]] talked her into survival — think about the city, not the group — took her face, and sent her running invisible. She asked for [[Brisk]] to go with her; Cael promised Brisk would follow, and Brisk did not.\n\n## Where she is\n\nUnknown. [[Vetel Kraye]] was her extraction — a griffon out — and says **she never arrived.** [[The Knife]] and [[The Songbird]] went after her with a direction the party gave them.\n\n> [!danger] Unresolved. This is the job, and nobody knows whether it succeeded.","links":["Rennik Dale","The Ashrit Circle","The Hand of Yartar","The Ravensworth","Duskandale","Tak","Sef","Fren","Brisk","The Hearthstone","Cael","Vetel Kraye","The Knife","The Songbird"]},{"name":"Elis","kind":"npc","tags":[],"props":{"tier":"recurring","status":"unknown","disposition":"unknown","gender":"female","based":"[[The Warrens]]","source":"[[Tom Farow]]","first_seen":"session-2"},"body":"*The potion mistress*\n\nNamed by [[Tom Farow]] as a possible source of an antidote, findable in [[The Warrens]] of [[Yartar]]. He was explicit that it was not a sure bet.\n\nNever pursued. Still a live lead, and nobody knows the party holds it.","links":["Tom Farow","The Warrens","Yartar"]},{"name":"Fren","kind":"npc","tags":[],"props":{"tier":"minor","status":"unknown","disposition":"neutral","gender":"female","based":"[[Duskandale]]","first_seen":"session-1","last_seen":"session-1"},"body":"Female. One of [[Devon Dale]]'s allies in [[Duskandale]]. Left with [[Brisk]], [[Sef]] and the documents.","links":["Devon Dale","Duskandale","Brisk","Sef"]},{"name":"Ghesh","kind":"npc","tags":["cael-circle"],"props":{"tier":"background","status":"alive","disposition":"ally","species":"half-orc","gender":"male","first_seen":"pre-campaign"},"body":"Aging half-orc caravan veteran. Taught [[Cael]] the guard's trade — spear, watch-order, how to sleep in four-hour pieces.\n\nStill tells anyone who will listen that the boy was slow to learn and quick to survive. Vouches unbidden. Won't stop.","links":["Cael"]},{"name":"Jandar Muln","kind":"npc","tags":["cael-circle"],"props":{"tier":"background","status":"alive","disposition":"employer","gender":"male","based":"[[Yartar]]","first_seen":"pre-campaign"},"body":"Caravan-master out of [[Yartar]], middling means, runs goods along the Evermoor Way and the Dessarin trade.\n\nHires [[Cael]] by the run. Trusts his blade and, more useful, his temper.\n\nHe is the reason Cael has a reason to be in the city — and to leave it for weeks at a time.","links":["Yartar","Cael"]},{"name":"Perra Volk","kind":"npc","tags":["cael-circle"],"props":{"tier":"background","status":"alive","disposition":"ally","gender":"female","based":"[[The Broke Wheel]]","first_seen":"pre-campaign"},"body":"Keeps [[The Broke Wheel]], out by [[Yartar]]'s north fields near the Hiring-Fair grounds.\n\nHolds a room for [[Cael]] between runs and mothers him without prying.","links":["The Broke Wheel","Yartar","Cael"]},{"name":"Rennik Dale","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"employer","gender":"male","based":"[[Waterfront]]","first_seen":"session-1","last_seen":"session-1"},"body":"*\"The Gatekeeper\"*\n\nGeneral merchant on the [[Waterfront]] and the best fixer in it. Standing in his good grace is described as a ticket to the next tier of work in [[Yartar]].\n\nFather of **[[Devon Dale]]**. He put out the job to bring her home safe, and sent [[Lorien]] to hire it done rather than come himself.\n\n> [!question] Why did he not come himself, and why [[Lorien]] as the messenger?\n\n**Owed:** an answer about his daughter. See [[Promises & Debts]].","links":["Waterfront","Yartar","Devon Dale","Lorien","Promises & Debts"]},{"name":"Reon Sahtar","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"hostile","gender":"male","faction":["[[The Unseen]]"],"based":"[[The Last Pint]]","source":"[[Tom Farow]]","first_seen":"session-2"},"body":"A top man of [[The Unseen]].\n\nNamed by [[Tom Farow]] as waiting at [[The Last Pint]] with a force larger than the one that ambushed the party. Not yet met. The party went east instead.\n\n> [!danger] He is still there, and the party killed his people and took their gear.","links":["The Unseen","Tom Farow","The Last Pint"]},{"name":"Sef","kind":"npc","tags":[],"props":{"tier":"minor","status":"unknown","disposition":"neutral","gender":"male","based":"[[Duskandale]]","first_seen":"session-1","last_seen":"session-1"},"body":"Male. One of [[Devon Dale]]'s allies in [[Duskandale]]. Left with [[Brisk]], [[Fren]] and the documents after the parley with [[The Knife]].","links":["Devon Dale","Duskandale","Brisk","Fren","The Knife"]},{"name":"Selda","kind":"npc","tags":[],"props":{"tier":"minor","status":"dead","disposition":"hostile","species":"high elf","gender":"female","faction":["[[The Unseen]]"],"first_seen":"session-2","last_seen":"session-2"},"body":"High elf, female. Wizard, and the caster of the [[The Unseen|Unseen]] party that ambushed the group in [[Session 2 - Marked by the Unseen|Session 2]]. Killed.\n\nHer effects are the best lead the party owns on what the Unseen actually are: [[Selda's Signet Ring]], [[Selda's Spellbook]], a [[Sending Stone]], a scroll of *blight*, and 9 pp.\n\n> [!question] A high elf wizard with a signet ring, working with a Warrens gang. Whose signet?","links":["The Unseen","Session 2 - Marked by the Unseen","Selda's Signet Ring","Selda's Spellbook","Sending Stone"]},{"name":"Silvio","kind":"npc","tags":[],"props":{"tier":"minor","status":"dead","disposition":"neutral","species":"gnome","gender":"male","first_seen":"session-0.5","last_seen":"session-0.5"},"body":"A gnome. Survived the massacre at [[Noannar's Hold]] long enough to reach [[Cael]] and [[Simon]] in the hollow beneath the dead.\n\nHe gave them his amulet and one request: **get it to his wife and three children in Silverymoon.**\n\nThen he died in their hands.\n\nSee [[Silvio's Amulet]] and [[Promises & Debts]].","links":["Noannar's Hold","Cael","Simon","Silvio's Amulet","Promises & Debts"]},{"name":"Sol","kind":"npc","tags":[],"props":{"tier":"minor","status":"presumed-dead","disposition":"friendly","gender":"male","based":"[[Noannar's Hold]]","first_seen":"session-0.5","last_seen":"session-0.5"},"body":"An old sailor at [[Noannar's Hold]], missing an eye, an arm and a leg — **all on his right side.**\n\nIt was his rumour that sent [[Cael]] to the temple: that the house of Eldath there stood on something older.\n\nHe was right. Presumed lost with the Hold.\n\n> [!question] All three on the right side is not how injuries usually happen.","links":["Noannar's Hold","Cael"]},{"name":"Tak","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"unknown","species":"half-orc","gender":"male","based":"[[Duskandale]]","first_seen":"session-1","last_seen":"session-3"},"body":"Half-orc, male. One of [[Devon Dale]]'s allies.\n\n**[[Session 1 - The Savage Daughter|S1]]:** a body was hanging outside the window at [[The Hearthstone]]. It was Tak's. [[Cael]] steered Devon's eyes away from it.\n\n**[[Session 3 - Trail of Hope|S3]]:** on the road back toward the village, Cael saw Tak **alive**, talking with a gathered group of people.\n\n> [!question] Was the body someone else? Was it never a body at all? Was he taken and returned, or was he theirs before any of it? And who was he talking to?\n\nOne of the hottest open items on [[Open Threads]].","links":["Devon Dale","Session 1 - The Savage Daughter","The Hearthstone","Cael","Session 3 - Trail of Hope","Open Threads","Duskandale"]},{"name":"The Knife","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"neutral","species":"human","gender":"male","faction":["[[The Ravensworth]]"],"first_seen":"session-1","last_seen":"session-2","aliases":["Doman Vein"],"name_confirmed":true},"body":"**Real name: [[Doman Vein]]** *(learned S3)*\n\nMale, human. One half of [[The Ravensworth]].\n\nHeld the party at the end of [[Session 1 - The Savage Daughter|Session 1]] and chose to talk. He knew things about them. He stated plainly that he does not kill without reason and wanted only [[Devon Dale]].\n\nHe offered antidotes for the poison taken at [[The Last Pint]] — and took, in exchange, the direction Devon had gone. Then he and [[The Songbird]] left to hunt her.\n\n## What he knows about us\n\n- Enough about the party to name it before the meeting.\n- That one of them works **illusions** — [[Cael]] wore Devon's face at him and [[Vaelis]] revealed it.\n\n> [!cael] Cael\n> An illusionist priest is a man doing a trick for his supper. He is content for that to be the whole of it.\n\n## Read\n\nNot an enemy so far. He dealt straight, kept his side, and left. He is also, by reputation, above the party's weight.","links":["The Ravensworth","Session 1 - The Savage Daughter","Devon Dale","The Last Pint","The Songbird","Cael","Vaelis"]},{"name":"The KrakenWizard","kind":"npc","tags":[],"props":{"tier":"minor","status":"dead","disposition":"hostile","gender":"male","faction":["[[The Kraken Society]]"],"first_seen":"session-0.5","last_seen":"session-0.5"},"body":"The wizard in the caves beneath [[Noannar's Hold]], destroyed by [[Vaelis]].\n\nHe gave his name as he died, and with it a promise: that the party would **regret interfering with [[The Kraken Society]]**.\n\nNothing has come of it yet.","links":["Noannar's Hold","Vaelis","The Kraken Society"]},{"name":"The Orc Warleader","kind":"npc","tags":[],"props":{"tier":"recurring","status":"alive","disposition":"hostile","species":"orc","gender":"female","faction":["[[The Orc Horde]]"],"based":"[[The Professor's Tower]]","first_seen":"session-3","last_seen":"session-3","name_confirmed":false},"body":"A towering female orc. Leads [[The Orc Horde]] besieging [[The Professor's Tower]] and camped in the [[Netheril|Netherese]] ruins.\n\nUnnamed. Not yet spoken to.","links":["The Orc Horde","The Professor's Tower","Netheril"]},{"name":"The Professor","kind":"npc","tags":[],"props":{"tier":"major","status":"alive","disposition":"employer","gender":"male","based":"[[The Professor's Tower]]","first_seen":"session-3","last_seen":"session-3","name_confirmed":false},"body":"*Working name. He has not given the party his own.*\n\nMaster wizard of [[The Professor's Tower]], east of the [[Evermoors]]. **[[Lorien]]'s former mentor.**\n\n## What he is doing\n\nClosing rifts between the material realm and the **[[Vanishing Tower]]** of **[[Ilvaeris]]**.\n\nHe also holds that **time is a collection of memories**, and the expeditions into the Vanishing Tower are an experiment intended to prove it. Those two projects do not
